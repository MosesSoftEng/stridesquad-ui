<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StrideSquad — Interactive Prototype v8</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="index" data-screen="scr-today" data-splash="1">

<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">
<div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
<div class="stage">
<section id="scr-splash" class="screen is-visible splash" data-screen data-od-id="splash" aria-label="Splash">
      <div class="splash__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="8.2" rx="3.1" ry="4.4" transform="rotate(-14 9 8.2)"/><ellipse cx="15.6" cy="14" rx="3.1" ry="4.4" transform="rotate(14 15.6 14)"/></svg>
      </div>
      <p class="splash__word">StrideSquad</p>
      <p class="splash__tag">Count steps. Squad up.</p>
      <span class="splash__bar" aria-hidden="true"><i></i></span>
    </section>
<section id="scr-today" class="screen" data-screen data-od-id="today" aria-label="Today">
      <div class="util-row" data-od-id="today-util-row">
        <button class="icon-btn bell" data-goto="scr-notif" aria-label="Notifications — 4 unread" data-od-id="today-bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13.5 6 9.5Z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></svg>
          <span class="bell__dot" data-bell-dot aria-hidden="true"></span>
        </button>
        <div class="util-row__end">
          <span class="chip u-hide" id="solo-chip" style="background:var(--primary-soft);color:var(--primary-ink);" data-od-id="today-solo-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
            Solo mode
          </span>
          <button class="sole-pill" data-goto="scr-wallet" aria-label="Sole wallet — 128 coins, up 12 today" data-od-id="today-sole-pill">👟<b class="num">128</b> ·<i>+12 today</i></button>
        </div>
      </div>

      <div class="screen-head">
        <div>
          <h2 class="screen-title">Today</h2>
          <p class="screen-sub" id="today-sub">Tuesday · Sunrise Steppers squad</p>
        </div>
      </div>

      <div class="card ring-card ring-card--tap" id="ring-card" role="button" tabindex="0" aria-expanded="false" aria-controls="today-week-strip" data-od-id="today-goal-card">
        <div class="ring-wrap">
          <svg class="ring" id="ring-svg" viewBox="0 0 200 200" role="img" aria-label="Goal ring: 7,842 of 9,000 steps">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" style="stop-color:var(--primary)"/>
                <stop offset="1" style="stop-color:var(--highlight)"/>
              </linearGradient>
            </defs>
            <circle class="ring__track" cx="100" cy="100" r="88"/>
            <circle class="ring__prog" id="ring-prog" cx="100" cy="100" r="88"/>
          </svg>
          <div class="ring-center">
            <p class="step-count num" id="step-count">0</p>
            <p class="step-goal" id="goal-text">of 9,000 steps</p>
          </div>
        </div>
        <p class="ring-caption num" id="ring-caption">7,842 of 9,000 · 87% — 1,158 to go</p>
        <p class="ring-hint" id="ring-hint" aria-hidden="true">Tap for this week ↓</p>
      </div>

      <div id="today-week-strip" hidden data-od-id="today-week-strip">
        <div class="stat-row" data-od-id="today-stats">
          <div class="stat-cell"><b>5.9</b><span>km walked</span></div>
          <div class="stat-cell"><b>314</b><span>kcal est.</span></div>
          <div class="stat-cell"><b id="stat-rank-val">6th</b><span id="stat-rank-lbl">in squad</span></div>
        </div>
        <div class="card" style="margin-top:14px;" data-od-id="today-week-card">
          <p class="card-label">This week</p>
          <div class="spark" aria-hidden="true" id="week-spark"></div>
        </div>
      </div>

      <button class="shield shield--tap" id="streak-shield" data-goto="scr-achievements" style="margin-top:14px;" data-od-id="today-streak-shield">
        <span class="shield__ic" aria-hidden="true" id="shield-ic">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2c.6 3-1.2 4.6-2.6 6C9 9.6 7.5 11.4 7.5 14a6.5 6.5 0 0 0 13 .3c-.3-2.9-2.2-4.6-3.4-6.3-.4 1-1.1 1.8-2 2.2.8-2.8.2-6.2-1.6-8.2Z"/></svg>
        </span>
        <div>
          <b id="shield-b">🔥 12-day streak — 1,158 steps to keep it</b>
          <span id="shield-sub">Steps count until midnight — fall short and the streak is gone</span>
        </div>
        <svg class="shield__go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>

      <div style="margin-top:16px;" data-od-id="today-squad-rank">
        <p class="card-label">Squad ranks · today</p>
        <div class="rank-strip">
          <button class="rank-card" data-rank-gid="sunrise" data-od-id="rank-card-sunrise" aria-label="Sunrise Steppers — up 2 places, now number 4. Open squad.">
            <span class="rank-card__name">Sunrise Steppers</span>
            <span class="rank-card__move delta-up"><i>▲2 →</i><b>#4</b></span>
            <span class="rank-card__sub">10 of 10 · 100%</span>
          </button>
          <button class="rank-card" data-rank-gid="office" data-od-id="rank-card-office" aria-label="Office Steps Challenge — down 1 place, now number 3. Open squad.">
            <span class="rank-card__name">Office Challenge</span>
            <span class="rank-card__move delta-down"><i>▼1 →</i><b>#3</b></span>
            <span class="rank-card__sub">8 of 10 · 80%</span>
          </button>
          <button class="rank-card" data-rank-gid="duo" data-od-id="rank-card-duo" aria-label="Just Us Two — holding number 1. Open squad.">
            <span class="rank-card__name">Just Us Two</span>
            <span class="rank-card__move delta-up"><i>#1</i><b>safe</b></span>
            <span class="rank-card__sub">Duo · 2 of 2 members</span>
          </button>
        </div>
      </div>

      <button class="gcta" data-goto="scr-nearby" data-od-id="today-community-hook">
        <span class="gcta__t">
          <span class="gcta__glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3.5c4 5 4 12 0 17-4-5-4-12 0-17Z"/></svg>
          </span>
          <span class="gcta__col"><b>You&rsquo;re in today&rsquo;s top 10% of walkers in Nairobi</b><span class="s">See the nearby board · updated 09:12</span></span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>

      <button class="gcta" data-goto="scr-achievements" data-od-id="today-achievement-teaser">
        <span class="gcta__t">
          <span class="gcta__glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/></svg>
          </span>
          <span class="gcta__col"><b>Night Owl — 1,158 steps away</b><span class="s">7,842 of 9,000 · 87% tonight</span>
            <span class="meter teaser-meter" aria-hidden="true"><span class="meter__fill" id="teaser-fill" style="width:87%"></span></span>
          </span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>

      <p class="hub-h">Squad feed</p>
      <button class="gcta" id="feed-aisha" data-od-id="today-feed-aisha">
        <span class="gcta__t">
          <span class="gcta__glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg>
          </span>
          <span class="gcta__col"><b>Aisha passed you 20 min ago</b><span class="s">Global board · open the room thread</span></span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="gcta" data-goto="scr-chat" data-od-id="today-feed-messages">
        <span class="gcta__t">
          <span class="gcta__glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>
          </span>
          <span class="gcta__col"><b>3 new messages in Sunrise Steppers</b><span class="s">Last one 08:15 · Jonas&rsquo; stadium lap</span></span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>

      <p class="hub-h">Sole</p>
      <button class="gcta" data-goto="scr-wallet" data-od-id="today-sole-bait">
        <span class="gcta__t">
          <span class="gcta__glyph" aria-hidden="true" style="font-size:20px;">👟</span>
          <span class="gcta__col"><b id="bait-head">3 👟 short of your daily cap</b><span class="s" id="bait-sub">128 👟 · 12 of 15 earned today · banked at midnight</span></span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>

      <div class="card" style="margin-top:16px;" id="pulse-card" data-od-id="today-squad-challenge">
        <div class="pulse-row">
          <div>
            <b style="font-size:15px;" id="pulse-title">Squad challenge</b>
            <p style="font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4;" id="pulse-text">2 of 10 members still short — your squad needs 4,300 steps</p>
          </div>
          <button class="btn btn--text" data-goto="scr-groups" data-od-id="today-pulse-open-groups">Open →</button>
        </div>
      </div>

      <div class="card savecard" style="margin-top:14px;" id="save-streak-card" data-od-id="today-save-streak" hidden>
        <b style="font-size:15px;">Save your streak</b>
        <p style="font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45;">You&rsquo;re 12 days in. Without an account, this streak and your squad spots can&rsquo;t be recovered.</p>
        <button class="btn btn--primary btn--block" id="btn-save-streak" data-od-id="today-save-streak-cta">Create account — 30 seconds</button>
      </div>
    </section>
</div><!-- /.stage -->
<nav class="tabbar" aria-label="Main navigation" data-od-id="tabbar">
      <button class="tab" data-tab="scr-today" data-od-id="tab-today">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="rotate(-12 8.2 10.5)"><ellipse cx="8.2" cy="10.9" rx="2.7" ry="3.6"/><circle cx="6.1" cy="5.5" r="1.05"/><circle cx="8.6" cy="4.6" r="1.1"/><circle cx="11.1" cy="5.6" r="0.85"/><ellipse cx="8.4" cy="16.6" rx="1.9" ry="2.1"/></g><g transform="rotate(12 15.8 14.5)"><ellipse cx="15.8" cy="14.9" rx="2.7" ry="3.6"/><circle cx="13.4" cy="9.9" r="0.85"/><circle cx="15.7" cy="8.9" r="1.1"/><circle cx="18.1" cy="9.8" r="1.05"/><ellipse cx="15.9" cy="20.5" rx="1.9" ry="1.9"/></g></svg>Today
      </button>
      <button class="tab" data-tab="scr-groups" data-od-id="tab-groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>Groups
      </button>
      <button class="tab" data-tab="scr-leaderboard" data-od-id="tab-leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17.5V21M7 4h10v4.5a5 5 0 0 1-10 0V4Z"/><path d="M7 5.5H4.2v1.6a3.2 3.2 0 0 0 3 3.2M17 5.5h2.8v1.6a3.2 3.2 0 0 1-3 3.2"/></svg>Board
      </button>
      <button class="tab" data-tab="scr-chat" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>Chat
      </button>
      <button class="tab" data-tab="scr-profile" data-od-id="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Profile
      </button>
    </nav>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div><!-- /.phone -->
    </div><!-- /.device-frame -->
  </div><!-- /.fit -->
  <figcaption class="device-caption" data-od-id="device-caption"><b>StrideSquad</b> — tap around, it works</figcaption>
</figure>

<script src="assets/app.js"></script>
</body>
</html>
