<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StrideSquad — Interactive Prototype v7</title>
<style>
  /* ─── tokens: the only place raw hex appears ─────────────────────── */
  :root {
    --bg:          #F1F5F9;   /* app background (brief: surfaces tint) */
    --surface:     #FFFFFF;   /* cards, sheets, tab bar */
    --ink:         #0F172A;   /* primary text (brief) — also the bezel */
    --muted:       #475569;   /* secondary text — 7.4:1 on white */
    --faint:       #64748B;   /* meta text, large-ish only */
    --border:      #E2E8F0;   /* hairlines */
    --primary:     #16A34A;   /* brand green (brief) */
    --primary-deep:color-mix(in srgb, var(--primary) 66%, var(--ink)); /* filled buttons: white text ≥4.5:1 */
    --primary-ink: color-mix(in srgb, var(--primary) 82%, var(--ink)); /* green text on white ≥4.5:1 */
    --primary-soft:color-mix(in srgb, var(--primary) 12%, var(--surface));
    --highlight:   #A3E635;   /* lime (brief) — ink text on it is ~9:1 */
    --danger:      #DC2626;
    --danger-soft: color-mix(in srgb, var(--danger) 10%, var(--surface));
    --on-primary:  #FFFFFF;
    --scrim:       color-mix(in srgb, var(--ink) 48%, transparent);
    --canvas:      #EEF2F1;   /* soft studio backdrop behind the device */
    --shadow-card: 0 1px 2px color-mix(in srgb, var(--ink) 6%, transparent),
                   0 8px 24px color-mix(in srgb, var(--ink) 7%, transparent);
    --shadow-sheet:0 -8px 32px color-mix(in srgb, var(--ink) 18%, transparent);
    --shadow-device: 0 2px 6px color-mix(in srgb, var(--ink) 12%, transparent),
                     0 26px 70px color-mix(in srgb, var(--ink) 20%, transparent);
    --radius-card: 24px;      /* brief: 24px rounded cards */
    --radius-ctl:  14px;
    --radius-glass: 48px;     /* screen corners inside the 58px bezel */
    --font:        -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono:        ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --tab-h:       64px;
    --sb-h:        54px;      /* in-app iOS status bar (desktop only) */
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background: var(--canvas);
    background-image: radial-gradient(120% 85% at 50% 0%,
      color-mix(in srgb, var(--canvas) 55%, white) 0%,
      var(--canvas) 58%,
      color-mix(in srgb, var(--canvas) 90%, var(--ink)) 100%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  input { font: inherit; }
  svg { display: block; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 3px solid var(--primary-ink); outline-offset: 2px; border-radius: 8px; }

  /* ─── device presentation ─────────────────────────────────────────
     Desktop (>500px): the whole app lives inside an iPhone frame —
     black bezel, 58px radius, dynamic island, in-app status bar —
     centred on a soft canvas with a subtle drop shadow and a caption.
     Mobile (≤500px): the frame dissolves and the app fills the
     viewport with safe-area insets; the status bar row disappears. */
  .device {
    margin: 0;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .fit { position: relative; width: 413px; height: 872px; } /* JS scales to fit short viewports */
  .device-frame {
    position: absolute; top: 0; left: 0;
    width: 413px; height: 872px;
    padding: 10px;
    background: var(--ink);
    border-radius: 58px;
    box-shadow:
      var(--shadow-device),
      inset 0 0 0 1px color-mix(in srgb, white 9%, transparent);
    transform-origin: top left;
  }
  .dev-btn {
    position: absolute; width: 3px; border-radius: 3px;
    background: color-mix(in srgb, var(--ink) 70%, black);
  }
  .dev-btn--mute    { left: -3px; top: 132px; height: 26px; }
  .dev-btn--volup   { left: -3px; top: 190px; height: 56px; }
  .dev-btn--voldown { left: -3px; top: 258px; height: 56px; }
  .dev-btn--power   { right: -3px; top: 220px; height: 88px; }

  .device-caption {
    font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    color: color-mix(in srgb, var(--ink) 52%, var(--canvas));
    text-align: center;
  }
  .device-caption b { font-weight: 800; color: color-mix(in srgb, var(--ink) 76%, var(--canvas)); }

  /* ─── app stage: the 393 × 852 screen ───────────────────────────── */
  .phone {
    position: relative;
    width: 393px; height: 852px;
    border-radius: var(--radius-glass);
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* in-app iOS status bar — pinned inside the frame, above app content */
  .ios-sb {
    flex: none; height: var(--sb-h);
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 30px 8px;
    font-size: 14px; font-weight: 700; color: var(--ink);
    position: relative; z-index: 36;
  }
  .ios-sb__time { font-variant-numeric: tabular-nums; }
  .ios-sb__island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 112px; height: 30px; border-radius: 16px; background: #000;
  }
  .ios-sb__icons { display: flex; gap: 6px; align-items: center; }
  .ios-sb__icons svg { display: block; }

  @media (max-width: 500px) {
    /* frame dissolves — the prototype is the app, full bleed */
    .device { width: 100%; }
    .fit { width: 100%; height: 100dvh; }
    .device-frame {
      position: static; width: 100%; height: 100dvh;
      padding: 0; background: transparent;
      border-radius: 0; box-shadow: none;
      transform: none !important;
    }
    .dev-btn, .ios-sb, .device-caption { display: none; }
    .phone {
      width: 100%; height: 100dvh;
      border-radius: 0;
      padding-top: env(safe-area-inset-top);
    }
  }

  /* ─── screens: exactly one visible at a time ──────────────────────── */
  .stage { position: relative; flex: 1; overflow: hidden; }
  .screen {
    position: absolute; inset: 0;
    overflow-y: auto; overscroll-behavior: contain;
    display: none;
    flex-direction: column;
    padding: 20px 18px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  .screen.is-visible { display: flex; }
  .screen--chat { padding-bottom: 0; overflow: hidden; }
  .no-tabbar .screen { padding-bottom: 24px; }
  .no-tabbar .tabbar { display: none; }

  .screen-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .screen-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .screen-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 18px;
  }
  .card + .card { margin-top: 14px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ─── buttons (44px+ targets) ─────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 12px 22px;
    border-radius: var(--radius-ctl);
    font-weight: 700; font-size: 16px; letter-spacing: -0.01em;
    transition: transform .06s ease, background .15s ease, border-color .15s ease;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.98); }
  .btn--primary { background: var(--primary-deep); color: var(--on-primary); }
  .btn--primary:hover { background: color-mix(in srgb, var(--primary-deep) 86%, var(--ink)); }
  .btn--ghost { background: var(--surface); color: var(--primary-ink); border: 1.5px solid var(--border); }
  .btn--ghost:hover { border-color: var(--primary); background: var(--primary-soft); }
  .btn--text { color: var(--primary-ink); min-height: 44px; padding: 10px 6px; font-weight: 700; }
  .btn--text:hover { color: color-mix(in srgb, var(--primary-ink) 80%, var(--ink)); }
  .btn--block { width: 100%; }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px;
    display: grid; place-items: center;
    color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover { color: var(--primary-ink); border-color: var(--primary); background: var(--primary-soft); }
  .icon-btn svg { width: 21px; height: 21px; }

  /* ─── onboarding ──────────────────────────────────────────────────── */
  .onb { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; max-width: 340px; margin: 0 auto; width: 100%; }
  .onb__mark {
    width: 74px; height: 74px; border-radius: 22px;
    background: var(--primary-deep); display: grid; place-items: center;
    box-shadow: var(--shadow-card);
  }
  .onb__mark svg { width: 40px; height: 40px; color: var(--highlight); }
  .onb__brand { font-size: 15px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--primary-ink); font-family: var(--mono); }
  .onb__title { font-size: clamp(30px, 8vw, 38px); font-weight: 800; line-height: 1.12; letter-spacing: -0.03em; text-wrap: balance; }
  .onb__lead { color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 30ch; }
  .onb__fine { color: var(--faint); font-size: 12px; text-align: center; }
  .health-card { display: flex; flex-direction: column; gap: 16px; }
  .health-card__row { display: flex; gap: 14px; align-items: center; }
  .health-card__glyph { width: 46px; height: 46px; border-radius: 14px; background: var(--primary-soft); display: grid; place-items: center; color: var(--primary-ink); flex: none; }
  .health-card__glyph svg { width: 24px; height: 24px; }
  .perm-list { display: flex; flex-direction: column; gap: 10px; }
  .perm { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .perm svg { width: 18px; height: 18px; color: var(--primary); flex: none; }

  /* ─── today ───────────────────────────────────────────────────────── */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px; padding: 5px 12px; border-radius: 999px;
    background: var(--highlight); color: var(--ink);
    font-weight: 700; font-size: 13px;
  }
  .chip svg { width: 16px; height: 16px; }
  .ring-card { display: flex; flex-direction: column; align-items: center; padding: 26px 18px 20px; }
  .ring-wrap { position: relative; width: min(236px, 64vw); aspect-ratio: 1; }
  .ring-wrap svg.ring { width: 100%; height: 100%; }
  .ring__track { fill: none; stroke: var(--border); stroke-width: 16; }
  .ring__prog { fill: none; stroke: url(#ringGrad); stroke-width: 16; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 100px 100px; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .step-count { font-size: 54px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .step-goal { color: var(--muted); font-size: 14px; font-weight: 600; }
  .ring-caption { margin-top: 14px; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat-cell { background: var(--surface); border-radius: 18px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow-card); }
  .stat-cell b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat-cell span { color: var(--faint); font-size: 12px; font-weight: 600; }
  .spark { display: flex; align-items: flex-end; gap: 8px; height: 96px; padding-top: 6px; }
  .spark__col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .spark__bar { width: 100%; max-width: 26px; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--primary) 30%, var(--surface)); }
  .spark__col--today .spark__bar { background: var(--primary-deep); }
  .spark__lbl { font-size: 10px; color: var(--faint); font-weight: 700; font-family: var(--mono); }
  .card-label { font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; font-family: var(--mono); }
  .pulse-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  /* ─── avatars / lists ─────────────────────────────────────────────── */
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: var(--primary-soft); color: var(--primary-ink);
    font-weight: 800; font-size: 14px; letter-spacing: -0.01em;
  }
  .avatar--lime { background: color-mix(in srgb, var(--highlight) 45%, var(--surface)); color: var(--ink); }
  .avatar--slate { background: color-mix(in srgb, var(--muted) 18%, var(--surface)); color: var(--muted); }
  .avatar--lg { width: 56px; height: 56px; font-size: 18px; }
  .member { display: flex; align-items: center; gap: 12px; padding: 11px 2px; }
  .member + .member { border-top: 1px solid var(--border); }
  .member__rank { width: 26px; font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--faint); text-align: center; flex: none; }
  .member__body { flex: 1; min-width: 0; }
  .member__name { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .member__steps { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .member--you .member__name::after {
    content: "YOU"; font-family: var(--mono); font-size: 9px; font-weight: 800; letter-spacing: 0.06em;
    background: var(--highlight); color: var(--ink); border-radius: 5px; padding: 2px 5px; margin-left: 8px; vertical-align: 2px;
  }
  .meter { display: block; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; margin-top: 5px; }
  .meter__fill { display: block; height: 100%; border-radius: 999px; background: var(--primary); }

  /* podium */
  .podium { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 10px; align-items: end; padding: 8px 2px 2px; }
  .pod { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pod__badge { font-family: var(--mono); font-size: 11px; font-weight: 800; color: var(--faint); }
  .pod__plinth { width: 100%; border-radius: 16px 16px 12px 12px; background: color-mix(in srgb, var(--primary) 10%, var(--surface)); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 12px 6px; gap: 4px; }
  .pod--1 .pod__plinth { background: var(--highlight); border-color: var(--highlight); min-height: 108px; justify-content: center; }
  .pod--2 .pod__plinth { min-height: 84px; justify-content: center; }
  .pod--3 .pod__plinth { min-height: 64px; justify-content: center; }
  .pod__name { font-size: 12px; font-weight: 800; }
  .pod__steps { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pod--1 .pod__steps { color: var(--ink); }

  /* ─── segmented controls ──────────────────────────────────────────── */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: color-mix(in srgb, var(--bg) 60%, var(--surface)); border: 1px solid var(--border); border-radius: calc(var(--radius-ctl) + 4px); padding: 4px; }
  .seg + .seg { margin-top: 8px; }
  .seg button { min-height: 44px; border-radius: var(--radius-ctl); font-size: 14px; font-weight: 700; color: var(--muted); transition: background .15s ease, color .15s ease; }
  .seg button:hover { color: var(--ink); }
  .seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px color-mix(in srgb, var(--ink) 12%, transparent); }

  .lb-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-radius: 14px; }
  .lb-row + .lb-row { border-top: 1px solid var(--border); }
  .lb-row--you { background: var(--primary-soft); }
  .lb-foot { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }

  /* ─── chat ────────────────────────────────────────────────────────── */
  .chat-scroll { flex: 1; overflow-y: auto; padding: 4px 18px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; gap: 10px; max-width: 86%; }
  .msg--out { margin-left: auto; flex-direction: row-reverse; }
  .msg__bubble { background: var(--surface); border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 15px; line-height: 1.45; box-shadow: var(--shadow-card); min-width: 0; overflow-wrap: break-word; }
  .msg--out .msg__bubble { background: var(--primary-deep); color: var(--on-primary); border-radius: 18px 18px 6px 18px; }
  .msg__time { display: block; font-family: var(--mono); font-size: 10px; margin-top: 4px; color: var(--faint); }
  .msg--out .msg__time { color: color-mix(in srgb, var(--on-primary) 75%, transparent); }
  .msg__menu { width: 44px; height: 44px; flex: none; display: grid; place-items: center; color: var(--faint); border-radius: 12px; align-self: center; }
  .msg__menu:hover { background: var(--surface); color: var(--ink); }
  .msg__menu svg { width: 18px; height: 18px; }
  .msg.is-hidden { display: none; }
  .composer { display: flex; gap: 10px; padding: 12px 18px calc(var(--tab-h) + 12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .composer input { flex: 1; min-width: 0; height: 50px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--bg); color: var(--ink); font-size: 15px; }
  .composer input:focus { outline: none; border-color: var(--primary); background: var(--surface); }
  .composer .btn { min-height: 50px; width: 64px; padding: 0; border-radius: 999px; }

  /* ─── forms ───────────────────────────────────────────────────────── */
  .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .field label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .field input { min-height: 50px; padding: 0 16px; border-radius: var(--radius-ctl); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 16px; }
  .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .field__err { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 18px; }
  .goal-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .goal-chips button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .goal-chips button.active { background: var(--highlight); border-color: var(--highlight); color: var(--ink); }
  .join-card input.code { text-transform: uppercase; letter-spacing: 0.14em; font-family: var(--mono); font-weight: 700; }

  /* ─── v5 · my groups ──────────────────────────────────────────────── */
  .gcard {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card); padding: 16px 18px; position: relative;
    transition: transform .06s ease, box-shadow .15s ease;
  }
  .gcard + .gcard { margin-top: 12px; }
  .gcard:active { transform: scale(0.99); }
  .gcard__row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .gcard__name { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-chip {
    flex: none; font-family: var(--mono); font-size: 11px; font-weight: 800;
    background: var(--primary-soft); color: var(--primary-ink);
    border-radius: 999px; padding: 5px 11px; letter-spacing: 0.02em;
  }
  .gcard__row2 { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .gcard__big { display: block; font-size: 29px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .gcard__bigsub { display: block; font-size: 12px; color: var(--faint); font-weight: 700; margin-top: 2px; }
  .spark-mini { flex: none; }
  .gcard__row3 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .gcard__occ { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .gcard__chev { color: var(--faint); flex: none; }
  .gcard__chev svg { width: 20px; height: 20px; }
  .av-stack { display: flex; }
  .av-stack .avatar { width: 28px; height: 28px; font-size: 10px; border: 2px solid var(--surface); }
  .av-stack .avatar + .avatar { margin-left: -9px; }
  .av-stack .av-more {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface);
    background: var(--bg); color: var(--muted); font-family: var(--mono);
    font-size: 10px; font-weight: 800; display: grid; place-items: center; margin-left: -9px;
  }
  .gcta {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left;
    background: var(--surface); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card); padding: 16px 18px;
    transition: transform .06s ease;
  }
  .gcta:active { transform: scale(0.99); }
  .gcta + .gcta { margin-top: 12px; }
  .gcta__t { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .gcta__glyph {
    width: 42px; height: 42px; border-radius: 14px; flex: none;
    background: var(--primary-soft); color: var(--primary-ink);
    display: grid; place-items: center; font-size: 22px; font-weight: 800;
  }
  .gcta__glyph svg { width: 22px; height: 22px; }
  .gcta b { font-size: 15px; font-weight: 800; display: block; }
  .gcta span.s { font-size: 12.5px; color: var(--muted); }
  .gcta > svg { width: 20px; height: 20px; color: var(--faint); flex: none; }

  /* ─── v5 · chat hub ───────────────────────────────────────────────── */
  .chan {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border-radius: 20px;
    box-shadow: var(--shadow-card); padding: 13px 16px;
    transition: transform .06s ease;
  }
  .chan:active { transform: scale(0.99); }
  .chan + .chan { margin-top: 10px; }
  .chan__mid { flex: 1; min-width: 0; }
  .chan__name { display: block; font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chan__prev { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chan__prev b { color: var(--ink); font-weight: 700; }
  .chan__end { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .chan__time { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .badge {
    min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
    background: var(--primary-deep); color: var(--on-primary);
    font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    display: grid; place-items: center;
  }
  .syscard {
    align-self: center; max-width: 86%; text-align: center;
    background: var(--primary-soft);
    border: 1px solid color-mix(in srgb, var(--primary) 26%, var(--border));
    border-radius: var(--radius-card); padding: 14px 16px;
  }
  .syscard b { display: block; font-size: 14px; font-weight: 800; }
  .syscard p { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .syscard .btn { margin-top: 10px; min-height: 44px; padding: 8px 18px; font-size: 14px; }
  .avatar--globe { background: color-mix(in srgb, var(--muted) 14%, var(--surface)); color: var(--muted); }
  .avatar--globe svg { width: 22px; height: 22px; }

  /* ─── v5 · leaderboard group chips ────────────────────────────────── */
  .gchips { display: flex; flex: none; gap: 8px; overflow-x: auto; padding: 14px 2px 6px; scrollbar-width: none; }
  .gchips::-webkit-scrollbar { display: none; }
  .gchips button {
    flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px;
    border: 1.5px solid var(--border); background: var(--surface);
    font-weight: 700; font-size: 14px; color: var(--muted);
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .gchips button:hover { color: var(--ink); border-color: var(--primary); }
  .gchips button.active { background: var(--highlight); border-color: var(--highlight); color: var(--ink); }

  /* ─── profile ─────────────────────────────────────────────────────── */
  .ach-scroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 12px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .ach {
    scroll-snap-align: start; flex: 0 0 138px; min-height: 160px;
    background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  }
  .ach__medal { width: 42px; height: 42px; border-radius: 14px; background: var(--primary-soft); display: grid; place-items: center; color: var(--primary-ink); }
  .ach__medal svg { width: 22px; height: 22px; }
  .ach b { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; }
  .ach span { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .ach--locked { opacity: 0.55; }
  .ach--locked .ach__medal { background: color-mix(in srgb, var(--muted) 12%, var(--surface)); color: var(--faint); }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
  .set-row + .set-row { border-top: 1px solid var(--border); }
  .set-row__t b { display: block; font-size: 15px; font-weight: 700; }
  .set-row__t span { font-size: 12.5px; color: var(--muted); }
  .switch { width: 56px; height: 34px; border-radius: 999px; background: var(--border); position: relative; flex: none; transition: background .18s ease; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 25%, transparent); transition: transform .18s ease; }
  .switch[aria-checked="true"] { background: var(--primary); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); }

  /* ─── tab bar ─────────────────────────────────────────────────────── */
  .tabbar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex;
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-size: 10.5px; font-weight: 700; min-height: 44px; transition: color .15s ease; }
  .tab svg { width: 24px; height: 24px; }
  .tab:hover { color: var(--muted); }
  .tab.active { color: var(--primary-ink); }

  /* ─── overlays: scrim, sheets, toast ──────────────────────────────── */
  .scrim { position: absolute; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 50;
    background: var(--surface); border-radius: var(--radius-card);
    box-shadow: var(--shadow-sheet);
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(calc(100% + 24px)); visibility: hidden;
    transition: transform .28s cubic-bezier(.22,.8,.28,1), visibility .28s;
  }
  .sheet.open { transform: translateY(0); visibility: visible; }
  .sheet__grab { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 14px; }
  .sheet h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .sheet p { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
  .link-row { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-ctl); padding: 0 14px; height: 52px; margin-top: 14px; }
  .link-row code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet .btn { margin-top: 14px; }
  .sheet .btn--cancel { background: var(--bg); color: var(--muted); }
  .sheet .btn--danger { color: var(--danger); background: var(--danger-soft); }
  .sheet .btn--danger:hover { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); }

  .toast {
    position: absolute; left: 50%; bottom: calc(var(--tab-h) + 20px + env(safe-area-inset-bottom)); transform: translate(-50%, 14px);
    z-index: 70; background: var(--ink); color: var(--surface);
    font-size: 14px; font-weight: 700; padding: 12px 20px; border-radius: 999px;
    box-shadow: var(--shadow-sheet); opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .reduce .ring__prog { transition: none !important; }
  .u-hide { display: none !important; }

  /* ─── v6 · goal fork ─────────────────────────────────────────────── */
  .fork-card { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface); border-radius:var(--radius-card); box-shadow:var(--shadow-card); border:1.5px solid transparent; padding:18px; transition:transform .06s ease, border-color .15s ease, background .15s ease; }
  .fork-card + .fork-card { margin-top:12px; }
  .fork-card:hover { border-color:var(--primary); background:var(--primary-soft); }
  .fork-card:active { transform:scale(.99); }
  .fork-card__glyph { width:54px; height:54px; border-radius:18px; flex:none; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary-ink); }
  .fork-card__glyph svg { width:27px; height:27px; }
  .fork-card__glyph--lime { background:color-mix(in srgb, var(--highlight) 55%, var(--surface)); color:var(--ink); }
  .fork-card__t { min-width:0; }
  .fork-card__t b { display:block; font-size:16.5px; font-weight:800; letter-spacing:-.01em; }
  .fork-card__t span { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  .fork-card > svg { width:20px; height:20px; color:var(--faint); flex:none; margin-left:auto; }

  /* ─── v6 · solo goal setup ───────────────────────────────────────── */
  .goal-out { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:2px; }
  .goal-out b { font-size:26px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .goal-out span { font-size:12.5px; color:var(--faint); font-weight:700; }
  .slider { -webkit-appearance:none; appearance:none; width:100%; height:30px; margin:10px 0 2px; background:transparent; }
  .slider::-webkit-slider-runnable-track { height:8px; border-radius:999px; background:var(--border); }
  .slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:28px; height:28px; margin-top:-10px; border-radius:50%; background:var(--primary-deep); border:3px solid var(--surface); box-shadow:0 1px 4px color-mix(in srgb, var(--ink) 30%, transparent); }
  .slider::-moz-range-track { height:8px; border-radius:999px; background:var(--border); }
  .slider::-moz-range-thumb { width:22px; height:22px; border-radius:50%; background:var(--primary-deep); border:3px solid var(--surface); box-shadow:0 1px 4px color-mix(in srgb, var(--ink) 30%, transparent); }
  .slider:focus-visible { outline:3px solid var(--primary-ink); outline-offset:4px; }
  .slider-scale { display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; font-weight:700; color:var(--faint); }

  /* ─── v6 · discover cards ────────────────────────────────────────── */
  .disc-lead { font-size:13.5px; color:var(--muted); margin-bottom:12px; line-height:1.45; }
  .pubcard { background:var(--surface); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:16px 18px; }
  .pubcard + .pubcard { margin-top:12px; }
  .pubcard__row1 { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .pubcard__name { font-size:16px; font-weight:800; letter-spacing:-.01em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pb { flex:none; display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; border-radius:999px; padding:6px 10px; }
  .pb svg { width:12px; height:12px; }
  .pb--open { background:var(--primary-soft); color:var(--primary-ink); }
  .pb--private { background:color-mix(in srgb, var(--muted) 14%, var(--surface)); color:var(--muted); }
  .pubcard__meta { display:flex; align-items:center; gap:16px; margin-top:10px; }
  .pubcard__big { font-size:26px; font-weight:800; letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums; }
  .pubcard__big small { display:block; font-size:11px; color:var(--faint); font-weight:700; letter-spacing:0; margin-top:2px; }
  .pubcard__occ { font-size:13px; color:var(--muted); font-weight:600; }
  .pubcard__note { font-size:12.5px; color:var(--muted); margin-top:9px; line-height:1.4; }
  .pubcard__note b { color:var(--ink); }
  .pubcard .btn { margin-top:12px; text-transform:uppercase; letter-spacing:.05em; font-size:13.5px; }
  .btn[disabled] { opacity:.6; cursor:default; }
  .btn[disabled]:active { transform:none; }
  .btn--requested { background:var(--primary-soft); color:var(--primary-ink); }

  /* ─── v6 · privacy segment ───────────────────────────────────────── */
  .seg--stack button { display:flex; flex-direction:column; justify-content:center; gap:2px; min-height:58px; padding:8px 10px; text-align:left; font-size:14px; }
  .seg--stack button small { font-size:10.5px; font-weight:600; color:var(--faint); line-height:1.25; }
  .seg--stack button.active small { color:var(--muted); }

  /* ─── v6 · group stats ───────────────────────────────────────────── */
  .wbars { display:flex; align-items:flex-end; gap:5px; height:158px; padding:10px 2px 0; }
  .wbar { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%; }
  .wbar__val { font-family:var(--mono); font-size:8.5px; font-weight:700; color:var(--faint); }
  .wbar__col { width:100%; max-width:22px; border-radius:6px 6px 3px 3px; background:color-mix(in srgb, var(--primary) 32%, var(--surface)); }
  .wbar--you .wbar__col { background:var(--primary-deep); }
  .wbar__lbl { font-size:9px; font-weight:800; color:var(--muted); font-family:var(--mono); letter-spacing:-.02em; }
  #gd-stat-row { margin-top:14px; }

  /* ─── v6 · hub sections ──────────────────────────────────────────── */
  .hub-h { font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-family:var(--mono); margin:16px 2px 8px; }
  .hub-h:first-child { margin-top:2px; }

  /* ─── v6 · user sheet ────────────────────────────────────────────── */
  .user-head { display:flex; align-items:center; gap:14px; margin-top:2px; }
  .user-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .user-stats div { background:var(--bg); border-radius:16px; padding:11px 6px; text-align:center; }
  .user-stats b { display:block; font-size:15px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .user-stats span { display:block; font-size:10px; color:var(--faint); font-weight:700; margin-top:2px; }
  .ubadges { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .ubadge { font-size:11.5px; font-weight:700; border-radius:999px; padding:5px 11px; background:color-mix(in srgb, var(--highlight) 42%, var(--surface)); color:var(--ink); }
  .lb-row--tap { cursor:pointer; }
  .lb-row--tap:hover { background:var(--primary-soft); }

  /* ─── v6 · QR placeholder ────────────────────────────────────────── */
  .qr-row { display:flex; align-items:center; gap:14px; margin-top:14px; background:var(--bg); border:1px dashed var(--border); border-radius:var(--radius-ctl); padding:12px 14px; }
  .qr-row svg { width:78px; height:78px; flex:none; fill:var(--ink); background:var(--surface); border-radius:10px; padding:5px; box-shadow:var(--shadow-card); }
  .qr-row p { font-size:11.5px; color:var(--muted); line-height:1.45; }
  .qr-row b { display:block; font-size:13px; color:var(--ink); margin-bottom:2px; }

  [hidden] { display: none !important; }

  /* ═════ v7 · auth + settings + psychology ═════ */
  :root {
    --warn:       #B45307;   /* amber ink on --warn-bg ≈ 7:1 */
    --warn-bg:    color-mix(in srgb, #F59E0B 16%, var(--surface));
    --warn-line:  color-mix(in srgb, #F59E0B 45%, var(--border));
    --g-blue: #4285F4; --g-red: #EA4335; --g-yellow: #FBBC05; --g-green: #34A853;
  }
  /* splash */
  .splash { align-items: center; justify-content: center; text-align: center; gap: 6px; }
  .splash__mark { width: 92px; height: 92px; border-radius: 28px; background: var(--primary-deep); display: grid; place-items: center; box-shadow: var(--shadow-card); }
  .splash__mark svg { width: 52px; height: 52px; color: var(--highlight); }
  .splash__word { font-family: var(--mono); font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--primary-ink); margin-top: 16px; }
  .splash__tag { font-size: 12.5px; color: var(--muted); }
  .splash__bar { width: 150px; height: 3px; border-radius: 999px; background: var(--border); overflow: hidden; margin-top: 24px; }
  .splash__bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--primary); animation: splashload 1.15s cubic-bezier(.3,.7,.4,1) forwards; }
  @keyframes splashload { 0% { width: 0 } 100% { width: 100% } }
  .reduce .splash__bar i { animation-duration: .01s; }

  /* progress rail (never zero) */
  .rail { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .rail__label { font-size: 12.5px; font-weight: 800; color: var(--muted); }
  .rail__label b { color: var(--primary-ink); }
  .rail__track { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .rail__fill { display: block; height: 100%; border-radius: 999px; background: var(--primary-deep); transition: width .3s ease; }
  .rail__steps { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: var(--faint); letter-spacing: .02em; }
  .rail__steps .done { color: var(--primary-ink); }

  /* auth */
  .auth { width: 100%; max-width: 348px; margin: 0 auto; }
  .social { display: flex; flex-direction: column; gap: 10px; }
  .social .btn { border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); }
  .social .btn:hover { border-color: var(--faint); background: var(--bg); }
  .social svg { width: 20px; height: 20px; flex: none; }
  .or { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--faint); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-family: var(--mono); }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .pw-row { position: relative; }
  .pw-row input { width: 100%; padding-right: 58px; }
  .pw-eye { position: absolute; right: 4px; top: 4px; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--faint); }
  .pw-eye:hover { color: var(--primary-ink); background: var(--primary-soft); }
  .pw-eye svg { width: 20px; height: 20px; }
  .strength { display: flex; gap: 5px; margin-top: 8px; }
  .strength i { flex: 1; height: 5px; border-radius: 999px; background: var(--border); transition: background .2s; }
  .strength i.on-weak { background: var(--danger); }
  .strength i.on-fair { background: var(--warn); }
  .strength i.on-strong { background: var(--primary); }
  .strength-label { font-size: 12px; font-weight: 800; min-height: 16px; margin-top: 5px; color: var(--muted); }
  .code-wrap { display: flex; gap: 9px; justify-content: space-between; margin: 8px 0 4px; }
  .codebox { width: 46px; height: 58px; text-align: center; border-radius: var(--radius-ctl); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 22px; font-weight: 800; font-family: var(--mono); }
  .codebox:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  /* settings rows / submenus */
  .srow { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; min-height: 60px; padding: 9px 2px; }
  .srow + .srow { border-top: 1px solid var(--border); }
  .srow__ic { width: 38px; height: 38px; border-radius: 12px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; flex: none; }
  .srow__ic svg { width: 19px; height: 19px; }
  .srow__ic--danger { background: var(--danger-soft); color: var(--danger); }
  .srow__t { flex: 1; min-width: 0; }
  .srow__t b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .srow__t span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .srow__end { flex: none; color: var(--faint); display: flex; align-items: center; gap: 8px; }
  .srow__end svg { width: 19px; height: 19px; }
  button.srow { border-radius: 14px; transition: background .15s; }
  button.srow:hover { background: var(--primary-soft); }
  .danger-row .srow__t b { color: var(--danger); }
  .danger-row:hover { background: var(--danger-soft) !important; }
  .link-quiet { color: var(--primary-ink); font-weight: 800; font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; }
  .link-quiet:hover { color: color-mix(in srgb, var(--primary-ink) 80%, var(--ink)); }
  .status-chip { flex: none; font-family: var(--mono); font-size: 10.5px; font-weight: 800; letter-spacing: .04em; border-radius: 999px; padding: 6px 11px; background: color-mix(in srgb, var(--muted) 13%, var(--surface)); color: var(--muted); }
  .status-chip--done { background: var(--primary-soft); color: var(--primary-ink); }
  .la-btn { flex: none; min-height: 40px; padding: 8px 15px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); font-weight: 800; font-size: 13px; color: var(--primary-ink); }
  .la-btn:hover { border-color: var(--primary); background: var(--primary-soft); }
  .la-btn--off { color: var(--muted); }
  .swatch { width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid transparent; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--ink); background: var(--primary-soft); transition: transform .06s, border-color .15s; }
  .swatch:hover { transform: scale(1.07); }
  .swatch.active { border-color: var(--ink); }
  .swatch--lime { background: color-mix(in srgb, var(--highlight) 45%, var(--surface)); }
  .swatch--slate { background: color-mix(in srgb, var(--muted) 18%, var(--surface)); color: var(--muted); }
  .swatch--amber { background: var(--warn-bg); color: var(--warn); }
  .avatar--amber { background: var(--warn-bg); color: var(--warn); }

  /* policy / terms docs */
  .doc { font-size: 13.5px; line-height: 1.6; color: var(--muted); }
  .doc h3 { font-size: 14.5px; font-weight: 800; color: var(--ink); letter-spacing: -.01em; margin: 20px 0 5px; }
  .doc h3:first-child { margin-top: 0; }
  .doc p + p { margin-top: 8px; }
  .doc ul, .doc ol { margin: 6px 0 0; padding-left: 18px; }
  .doc li { margin-top: 5px; }
  .doc .panel { margin: 18px 0; padding: 16px 18px; border-radius: var(--radius-ctl); background: var(--primary-soft); border: 1.5px solid color-mix(in srgb, var(--primary) 32%, var(--border)); }
  .doc .panel h3 { margin: 0 0 6px; }
  .doc .panel p { color: var(--ink); }
  .doc .panel b { color: var(--primary-ink); }

  /* today v7 — loss framing + reciprocity */
  .shield { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-card); background: var(--warn-bg); border: 1.5px solid var(--warn-line); box-shadow: var(--shadow-card); margin-bottom: 14px; }
  .shield__ic { width: 40px; height: 40px; border-radius: 14px; background: var(--surface); display: grid; place-items: center; flex: none; color: var(--warn); box-shadow: var(--shadow-card); }
  .shield__ic svg { width: 22px; height: 22px; }
  .shield b { display: block; font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); }
  .shield span { display: block; font-size: 12.5px; color: var(--warn); font-weight: 700; margin-top: 1px; }
  .shield.met { background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 32%, var(--border)); }
  .shield.met .shield__ic { color: var(--primary-ink); }
  .shield.met span { color: var(--primary-ink); }
  .savecard { border: 1.5px solid var(--warn-line); }
  .savecard .btn { margin-top: 12px; }
  .nudge { display: flex; align-items: center; gap: 10px; background: var(--warn-bg); border: 1.5px solid var(--warn-line); border-radius: var(--radius-ctl); padding: 9px 8px 9px 14px; margin: -4px 0 16px; }
  .nudge svg.nudge__ic { width: 20px; height: 20px; color: var(--warn); flex: none; }
  .nudge b { font-size: 13.5px; font-weight: 800; }
  .nudge__go { margin-left: auto; flex: none; color: var(--warn); font-weight: 800; font-size: 13px; min-height: 44px; padding: 0 10px; border-radius: 10px; }
  .nudge__go:hover { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }

  /* leaderboard delta */
  .lb-delta { flex: none; text-align: right; }
  .lb-delta b { display: block; font-size: 13.5px; font-weight: 800; color: var(--primary-ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .lb-delta--neg b { color: var(--muted); }
  .lb-delta small { display: block; font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: var(--faint); letter-spacing: .04em; margin-top: 1px; }

  /* discover sort · recommended chip · goal hint */
  .seg--3 { grid-template-columns: 1fr 1fr 1fr; margin-bottom: 12px; }
  .chip--rec { min-height: 0; padding: 2px 8px; font-size: 10px; letter-spacing: .03em; }
  .goal-hint { font-size: 12.5px; color: var(--faint); margin-top: 9px; }
  .goal-hint b { color: var(--muted); font-weight: 700; }

  /* sheet textarea + delete confirm */
  .field textarea { min-height: 96px; padding: 12px 14px; border-radius: var(--radius-ctl); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 15px; font-family: inherit; line-height: 1.45; resize: none; }
  .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .del-box { margin-top: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-ctl); padding: 12px 14px 12px 16px; }
  .del-box ul { padding-left: 16px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .del-box li { margin-top: 4px; }
  .fineprint { font-size: 12px; color: var(--faint); margin-top: 10px; line-height: 1.5; text-align: center; }

  /* empty states · deleted */
  .empty { text-align: center; padding: 34px 16px; color: var(--muted); }
  .empty svg { width: 46px; height: 46px; color: var(--faint); margin: 0 auto 12px; }
  .empty b { display: block; font-size: 15px; font-weight: 800; color: var(--ink); }
  .empty p { font-size: 13px; margin-top: 4px; line-height: 1.5; }
  .deleted { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center; padding: 0 12px; }
  .deleted__ic { width: 86px; height: 86px; border-radius: 30px; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; }
  .deleted__ic svg { width: 44px; height: 44px; }
  .deleted h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .deleted p { color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 32ch; }

  /* FAQ */
  .faq { border-bottom: 1px solid var(--border); }
  .faq:last-child { border-bottom: 0; }
  .faq__q { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; min-height: 54px; font-size: 14.5px; font-weight: 800; }
  .faq__q svg { width: 18px; height: 18px; color: var(--faint); flex: none; transition: transform .2s ease; }
  .faq__q[aria-expanded="true"] svg { transform: rotate(180deg); }
  .faq__q:hover { color: var(--primary-ink); }
  .faq__a { font-size: 13.5px; color: var(--muted); line-height: 1.55; padding: 0 2px 14px; }

</style>
</head>
<body>
<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">

        <!-- ══ in-app iOS status bar (desktop only — hidden ≤500px) ══ -->
        <div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>

        <div class="stage" data-od-id="stage">

    <!-- ══ 0 · v7 SPLASH ══ -->
    <section id="scr-splash" class="screen is-visible splash" data-screen data-od-id="splash" aria-label="Splash">
      <div class="splash__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="8.2" rx="3.1" ry="4.4" transform="rotate(-14 9 8.2)"/><ellipse cx="15.6" cy="14" rx="3.1" ry="4.4" transform="rotate(14 15.6 14)"/></svg>
      </div>
      <p class="splash__word">StrideSquad</p>
      <p class="splash__tag">Count steps. Squad up.</p>
      <span class="splash__bar" aria-hidden="true"><i></i></span>
    </section>

    <!-- ══ 1 · ONBOARDING ═══════════════════════════════════════════ -->
    <section id="scr-onboarding" class="screen" data-screen data-od-id="onboarding" aria-label="Onboarding">
      <div class="onb" id="onb-intro">
        <div class="onb__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="8.2" rx="3.1" ry="4.4" transform="rotate(-14 9 8.2)"/><ellipse cx="15.6" cy="14" rx="3.1" ry="4.4" transform="rotate(14 15.6 14)"/></svg>
        </div>
        <p class="onb__brand">StrideSquad</p>
        <h1 class="onb__title">Count steps. Squad up. Climb the leaderboard together.</h1>
        <p class="onb__lead">Join a 10-person squad, see who's walking right now, and turn daily steps into a friendly climb.</p>
        <button class="btn btn--primary btn--block" id="btn-get-started" data-od-id="onboarding-get-started">Get started</button>
        <p class="onb__fine">Prototype with mock data · no account needed</p>
      </div>

      <div class="onb" id="onb-connect" hidden>
        <div class="card health-card" data-od-id="health-connect-card">
          <div class="health-card__row">
            <div class="health-card__glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 12h4l2-6 3.5 12 2-6h5.5"/></svg>
            </div>
            <div>
              <h3 style="font-size:16px;font-weight:800;">Share steps with StrideSquad</h3>
              <p style="font-size:13px;color:var(--muted);margin-top:2px;">Connects to Apple Health or Health Connect</p>
            </div>
          </div>
          <div class="perm-list">
            <p class="perm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>Step count — read</p>
            <p class="perm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>Walking distance — read</p>
            <p class="perm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>Workouts — write summary</p>
          </div>
          <button class="btn btn--primary btn--block" id="btn-allow-health" data-od-id="onboarding-allow">Allow</button>
          <button class="btn btn--text btn--block" id="btn-skip-health">Not now — browse the demo</button>
        </div>
      </div>
    </section>

    <!-- ══ 1b · GOAL FORK ═══════════════════════════════════════════ -->
    <section id="scr-choose" class="screen" data-screen data-od-id="goal-fork" aria-label="Choose your path">
      <div class="onb" style="max-width:360px;">
        <p class="onb__brand">Almost there</p>
        <h1 class="onb__title" style="font-size:31px;">What brings you here?</h1>
        <p class="onb__lead">Pick a starting point — you can change your mind later from Groups or your profile.</p>
      <div class="rail" role="status" aria-label="Setup progress" data-od-id="rail-rail-choose">
        <p class="rail__label" id="rail-choose-label">Step 3 of 5</p>
        <span class="rail__track"><span class="rail__fill" id="rail-choose-fill" style="width:60%"></span></span>
        <span class="rail__steps" aria-hidden="true"><span class="done">Account</span><span>Health</span><span>Path</span><span>Goal</span><span>Start</span></span>
      </div>
        <button class="fork-card" id="btn-fork-squad" data-od-id="fork-squad">
          <span class="fork-card__glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>
          </span>
          <span class="fork-card__t"><b>Squad up</b><span>Join or create a group</span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button class="fork-card" id="btn-fork-solo" data-od-id="fork-solo">
          <span class="fork-card__glyph fork-card__glyph--lime" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="8.2" rx="3.1" ry="4.4" transform="rotate(-14 9 8.2)"/><ellipse cx="15.6" cy="14" rx="3.1" ry="4.4" transform="rotate(14 15.6 14)"/></svg>
          </span>
          <span class="fork-card__t"><b>Just me</b><span>Track my steps against my own goal</span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button class="btn btn--text" id="btn-fork-back" data-od-id="fork-back">← Back to health permissions</button>
      </div>
    </section>

    <!-- ══ 1c · SOLO GOAL SETUP ═════════════════════════════════════ -->
    <section id="scr-goal" class="screen" data-screen data-od-id="goal-setup" aria-label="Set your daily goal">
      <div class="screen-head">
        <div>
          <h2 class="screen-title">Set your goal</h2>
          <p class="screen-sub">A daily target just for you</p>
        </div>
        <button class="icon-btn" data-goto="scr-choose" aria-label="Back" data-od-id="goal-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
        </button>
      </div>

      <div class="rail" role="status" aria-label="Setup progress" data-od-id="rail-rail-goal">
        <p class="rail__label" id="rail-goal-label">Step 4 of 5</p>
        <span class="rail__track"><span class="rail__fill" id="rail-goal-fill" style="width:80%"></span></span>
        <span class="rail__steps" aria-hidden="true"><span class="done">Account</span><span>Health</span><span>Path</span><span>Goal</span><span>Start</span></span>
      </div>
      <div class="card" data-od-id="goal-target-card">
        <p class="card-label">Daily step target</p>
        <div class="goal-chips" id="solo-goal-chips" role="group" aria-label="Quick targets" style="margin-bottom:16px;">
          <button type="button" data-sgoal="6000">6,000</button>
          <button type="button" data-sgoal="7000">7,000</button>
          <button type="button" data-sgoal="8000">8,000</button>
          <button type="button" class="active" data-sgoal="9000">9,000</button>
          <button type="button" data-sgoal="10000">10,000</button>
          <button type="button" data-sgoal="11000">11,000</button>
          <button type="button" data-sgoal="12000">12,000</button>
        </div>
        <p class="goal-hint" style="margin-top:-8px;margin-bottom:6px;"><b>9,000</b> — most squads pick this</p>
        <div class="goal-out"><b id="goal-readout" class="num">9,000</b><span>steps per day</span></div>
        <input class="slider" type="range" id="goal-slider" min="2000" max="20000" step="500" value="9000" aria-label="Custom daily step target">
        <div class="slider-scale"><span>2k</span><span>11k</span><span>20k</span></div>
      </div>

      <div class="card" style="margin-top:14px;" data-od-id="goal-reminder-card">
        <div class="set-row" style="min-height:52px;">
          <div class="set-row__t"><b>Weekly reminder</b><span>Sunday 6pm recap of your week</span></div>
          <button class="switch" role="switch" aria-checked="true" id="sw-weekly" aria-label="Weekly reminder"></button>
        </div>
      </div>

      <button class="btn btn--primary btn--block" id="btn-save-goal" style="margin-top:18px;" data-od-id="goal-save">Save &amp; start tracking</button>
      <p style="font-size:12.5px;color:var(--faint);text-align:center;margin-top:12px;line-height:1.45;">Solo mode hides squad ranks — you can still join a group later from Groups › Discover.</p>
    </section>

    <!-- ══ 2 · TODAY ════════════════════════════════════════════════ -->
    <section id="scr-today" class="screen" data-screen data-od-id="today" aria-label="Today">
      <div class="screen-head">
        <div>
          <h2 class="screen-title">Today</h2>
          <p class="screen-sub" id="today-sub">Tuesday · Sunrise Steppers squad</p>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="chip" data-od-id="today-streak-chip" title="Current streak">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2c.6 3-1.2 4.6-2.6 6C9 9.6 7.5 11.4 7.5 14a6.5 6.5 0 0 0 13 .3c-.3-2.9-2.2-4.6-3.4-6.3-.4 1-1.1 1.8-2 2.2.8-2.8.2-6.2-1.6-8.2Z"/></svg>
            12-day streak
          </span>
          <span class="chip u-hide" id="solo-chip" style="background:var(--primary-soft);color:var(--primary-ink);" data-od-id="today-solo-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
            Solo mode
          </span>
        </div>
      </div>

      <div class="shield" id="streak-shield" data-od-id="today-streak-shield" role="status">
        <span class="shield__ic" aria-hidden="true" id="shield-ic">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2c.6 3-1.2 4.6-2.6 6C9 9.6 7.5 11.4 7.5 14a6.5 6.5 0 0 0 13 .3c-.3-2.9-2.2-4.6-3.4-6.3-.4 1-1.1 1.8-2 2.2.8-2.8.2-6.2-1.6-8.2Z"/></svg>
        </span>
        <div>
          <b id="shield-b">🔥 12-day streak — 1,158 steps to keep it</b>
          <span id="shield-sub">Steps count until midnight — fall short and the streak is gone</span>
        </div>
      </div>
      <div class="card ring-card" data-od-id="today-goal-card">
        <div class="ring-wrap">
          <svg class="ring" id="ring-svg" viewBox="0 0 200 200" role="img" aria-label="Goal ring: 7,842 of 9,000 steps">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" style="stop-color:var(--primary)"/>
                <stop offset="1" style="stop-color:var(--highlight)"/>
              </linearGradient>
            </defs>
            <circle class="ring__track" cx="100" cy="100" r="88"/>
            <circle class="ring__prog" id="ring-prog" cx="100" cy="100" r="88"/>
          </svg>
          <div class="ring-center">
            <p class="step-count num" id="step-count">0</p>
            <p class="step-goal" id="goal-text">of 9,000 steps</p>
          </div>
        </div>
        <p class="ring-caption" id="ring-caption">87% of today's goal · 1,158 to go</p>
      </div>

      <div class="stat-row" data-od-id="today-stats">
        <div class="stat-cell"><b>5.9</b><span>km walked</span></div>
        <div class="stat-cell"><b>314</b><span>kcal est.</span></div>
        <div class="stat-cell"><b id="stat-rank-val">6th</b><span id="stat-rank-lbl">in squad</span></div>
      </div>

      <div class="card" style="margin-top:14px;" data-od-id="today-week-card">
        <p class="card-label">This week</p>
        <div class="spark" aria-hidden="true" id="week-spark"></div>
      </div>

      <div class="card" style="margin-top:14px;" id="pulse-card" data-od-id="today-squad-challenge">
        <div class="pulse-row">
          <div>
            <b style="font-size:15px;" id="pulse-title">Squad challenge</b>
            <p style="font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4;" id="pulse-text">2 of 10 members still short — your squad needs 4,300 steps</p>
          </div>
          <button class="btn btn--text" data-goto="scr-groups" data-od-id="today-pulse-open-groups">Open →</button>
        </div>
      </div>

      <div class="card savecard" style="margin-top:14px;" id="save-streak-card" data-od-id="today-save-streak" hidden>
        <b style="font-size:15px;">Save your streak</b>
        <p style="font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45;">You&rsquo;re 12 days in. Without an account, this streak and your squad spots can&rsquo;t be recovered.</p>
        <button class="btn btn--primary btn--block" id="btn-save-streak" data-od-id="today-save-streak-cta">Create account — 30 seconds</button>
      </div>
    </section>

    <!-- ══ 3 · MY GROUPS ════════════════════════════════════════════ -->
    <section id="scr-groups" class="screen" data-screen data-od-id="my-groups" aria-label="My Groups">
      <div class="screen-head">
        <div>
          <h2 class="screen-title">Groups</h2>
          <p class="screen-sub" id="mg-sub">3 groups · week of Nov 2</p>
        </div>
      </div>

      <div class="seg" role="group" aria-label="Groups view" data-od-id="groups-seg">
        <button class="active" data-gview="mine">My groups</button>
        <button data-gview="discover">Discover</button>
      </div>

      <div id="grp-mine" style="margin-top:14px;">
      <div id="groups-list" data-od-id="groups-list"></div>

      <div style="margin-top:14px;" data-od-id="groups-actions">
        <button class="gcta" id="btn-open-create" data-od-id="groups-create-card">
          <span class="gcta__t">
            <span class="gcta__glyph" aria-hidden="true">+</span>
            <span><b>Create group</b><span class="s">Name it, set a goal, invite walkers</span></span>
          </span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button class="gcta" id="btn-open-join" data-od-id="groups-join-card">

    <section id="scr-privacy-policy" class="screen" data-screen data-od-id="privacy-policy" aria-label="Privacy policy">
<div class="screen-head"><div><h2 class="screen-title" style="font-size:23px;">Privacy policy</h2><p class="screen-sub">Plain words. Last updated 3 Nov 2026.</p></div><button class="icon-btn" data-goto="scr-settings-privacy" aria-label="Back" data-od-id="privacy-policy-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button></div>
      <div class="card doc" data-od-id="policy-body">
        <h3>Who we are</h3>
        <p>StrideSquad is a small step-counting app for walking squads. This policy covers the StrideSquad app and its companion services.</p>
        <h3>What we collect</h3>
        <ul>
          <li><b>Account data</b> — your name, email and (hashed) password.</li>
          <li><b>Health data</b> — daily step counts and walking distance, read with your permission. See the panel below.</li>
          <li><b>Activity data</b> — squads you join, messages you send, challenges you enter.</li>
          <li><b>Device data</b> — app version and crash diagnostics, kept minimal.</li>
        </ul>
        <div class="panel" data-od-id="policy-health-panel">
          <h3>Health data</h3>
          <p><b>Steps are read from Health Connect / Apple Health, never used for advertising, never sold.</b> We store daily totals for your leaderboard and streak — not raw health records, not heart rate, not location. You can disconnect the health source any time from Settings &rsaquo; Linked accounts, and the sync stops immediately.</p>
        </div>
        <h3>How we use it</h3>
        <p>Only to run the features you asked for: your goal ring, streaks, squad leaderboards, and the reminders you turned on. No ad SDKs ship in the app — there is nothing to target you with.</p>
        <h3>What your squad sees</h3>
        <p>Members of a squad see your display name, initials, steps and rank. Nothing else. Global boards show a pseudonymous walker card — name, steps, streak — and you can leave the global board from Settings anytime.</p>
        <h3>Sharing</h3>
        <p>We don&rsquo;t sell or rent your data. We share it only if we must, to comply with law or protect safety, and we tell you when we do (unless legally silenced).</p>
        <h3>Retention and deletion</h3>
        <p>Delete your account from Settings &rsaquo; Account and your data is scheduled for erasure within 30 days. Signing back in within that window cancels the erasure. Export what&rsquo;s yours first — Settings &rsaquo; Account &rsaquo; Export my data.</p>
        <h3>Your rights</h3>
        <p>Access, correct, export, object, delete. Do all five from inside the app, or write to support@stridesquad.app and we&rsquo;ll do it for you.</p>
      </div>
    </section>

    <section id="scr-terms" class="screen" data-screen data-od-id="terms" aria-label="Terms of service">
<div class="screen-head"><div><h2 class="screen-title" style="font-size:23px;">Terms of service</h2><p class="screen-sub">Short enough to actually read</p></div><button class="icon-btn" data-goto="scr-settings-privacy" aria-label="Back" data-od-id="terms-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button></div>
      <div class="card doc" data-od-id="terms-body">
        <h3>1 · Acceptance</h3>
        <p>By creating an account you agree to these terms. If you don&rsquo;t agree, don&rsquo;t use the app — no hard feelings.</p>
        <h3>2 · Your account</h3>
        <p>One real account per person. Keep your password to yourself. You can export or delete your account from Settings at any time.</p>
        <h3>3 · Fair walking</h3>
        <p>Steps must come from your own movement via a connected health source. Shaking a phone at a dog or buying fake steps gets your rank hidden from squads and, on repeat, ends the account.</p>
        <h3>4 · Conduct in chats</h3>
        <p>Squad and global rooms are community spaces. Harassment or spam gets you reported, blocked and moderated. Block anyone instantly from a message&rsquo;s options — they vanish from your feeds and land on your blocklist.</p>
        <h3>5 · Not medical advice</h3>
        <p>StrideSquad counts steps. It is not a medical device, and its numbers are not health advice. Check with a professional before changing your training because a leaderboard told you to.</p>
        <h3>6 · Changes and ending</h3>
        <p>If we change these terms we&rsquo;ll tell you in-app first. You can stop anytime; we may stop service with 30 days notice. Sections on data and conduct survive cancellation.</p>
      </div>
    </section>

          <p class="faq__a" id="faq-a1" hidden>Only from the health source you connected — Health Connect on Android, Apple Health on iPhone. StrideSquad reads daily step totals with your permission and never invents numbers. If the source pauses, the ring pauses too.</p>

        <div class="faq">

          <p class="faq__a" id="faq-a2" hidden>Yes — squad leaderboards show today&rsquo;s and this week&rsquo;s totals next to your name. That&rsquo;s the whole game. Your route, heart rate and everything else stay on your device; only step totals leave it.</p>

        <div class="faq">

          <p class="faq__a" id="faq-a3" hidden>Settings &rsaquo; Account &rsaquo; Delete account. Type DELETE to confirm, and everything — steps, squads, chats — is scheduled for erasure within 30 days. Logging back in inside that window cancels it, and you can request your .zip export first.</p>
