<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StrideSquad — Interactive Prototype v8</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="signup" data-screen="scr-signup">

<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">
<div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
<div class="stage">
<section id="scr-signup" class="screen" data-screen data-od-id="signup" aria-label="Sign up">
      <div class="auth">
        <div class="screen-head">
          <div>
            <h2 class="screen-title" style="font-size:25px;">Create account</h2>
            <p class="screen-sub">First things first — so your streak has a home</p>
          </div>
          <button class="icon-btn" id="btn-signup-skip-x" aria-label="Browse the demo — no account needed" data-od-id="signup-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="field"><label for="su-name">Name</label><input id="su-name" type="text" placeholder="Your name" autocomplete="off" autocomplete="name" maxlength="24"></div>
        <div class="field"><label for="su-email">Email</label><input id="su-email" type="email" placeholder="you@example.com" autocomplete="off" autocomplete="email"></div>
        <div class="field"><label for="su-pass">Password</label><div class="pw-row"><input id="su-pass" type="password" autocomplete="off" placeholder="8+ characters"></div><button class="pw-eye" type="button" id="eye-su-pass" aria-label="Show password" aria-pressed="false"><svg class="pw-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c5 0 9 4.5 9.5 7-.13.63-1.2 2.6-3.1 4.25M6.1 6.6C3.9 8.15 2.6 10.6 2.5 12c.5 2.5 4.5 7 9.5 7 1.6 0 3.1-.43 4.35-1.14"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg><svg class="pw-on u-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12C3 9.5 7 5 12 5s9 4.5 9.5 7c-.5 2.5-4.5 7-9.5 7s-9-4.5-9.5-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <p class="field__err" id="su-err" role="alert"></p>
        <button class="btn btn--primary btn--block" id="btn-signup-submit" data-od-id="signup-submit">Create account</button>
        <p class="or">or continue with</p>
        <div class="social" data-od-id="signup-social">
          <button class="btn btn--block" type="button" id="btn-signup-apple" data-od-id="signup-apple"><svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 123.6 107.2 121.6 25.2-.6 43.2-17.9 78-17.9 34.8 0 51.6 17.9 78 17.9 48.2 2 93.2-83.2 105.6-119.9-66.6-31.3-64.9-92.3-64.9-94.6Zm-59.1-172.9c30.3-35.8 27.6-68.3 26.7-79.9-32.2 4.7-69.5 22.7-89 48.3-21.7 26.1-33.9 58.6-31.3 95.1 34 2.5 64.9-14.6 93.6-63.5Z"/></svg> Continue with Apple</button>
          <button class="btn btn--block" type="button" id="btn-signup-google" data-od-id="signup-google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="var(--g-red)" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.9c-.5 2.7-2.1 5.1-4.4 6.6v5.5h7.1c4.2-3.8 6.5-9.5 6.5-16.1z"/><path fill="var(--g-green)" d="M24 46c5.9 0 10.9-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.7 0-10.6-3.9-12.3-9.1H4.3v5.7C7.9 41.1 15.4 46 24 46z"/><path fill="var(--g-yellow)" d="M11.7 28.1c-.7-1.6-1-3.4-1-5.2s.4-3.7 1-5.3v-5.7H4.3C2.9 14.3 2 18.5 2 22.9s.9 8.6 2.3 11l7.4-5.8z"/><path fill="var(--g-blue)" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.4 2 7.9 6.9 4.3 14.2l7.4 5.8c1.7-5.2 6.6-9.2 12.3-9.2z"/></svg> Continue with Google</button>
        </div>
        <p style="text-align:center;margin-top:16px;font-size:14px;color:var(--muted);">Already have an account? <button class="btn btn--text" style="min-height:40px;padding:2px 6px;" data-goto="scr-login" data-od-id="signup-to-login">Log in</button></p>
        <p style="text-align:center;margin-top:2px;"><button class="link-quiet" id="btn-signup-skip" data-od-id="signup-skip" style="font-size:13px;">Browse the demo — no account needed</button></p>
      </div>
    </section>
</div><!-- /.stage -->
<nav class="tabbar" aria-label="Main navigation" data-od-id="tabbar">
      <button class="tab" data-tab="scr-today" data-od-id="tab-today">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="rotate(-12 8.2 10.5)"><ellipse cx="8.2" cy="10.9" rx="2.7" ry="3.6"/><circle cx="6.1" cy="5.5" r="1.05"/><circle cx="8.6" cy="4.6" r="1.1"/><circle cx="11.1" cy="5.6" r="0.85"/><ellipse cx="8.4" cy="16.6" rx="1.9" ry="2.1"/></g><g transform="rotate(12 15.8 14.5)"><ellipse cx="15.8" cy="14.9" rx="2.7" ry="3.6"/><circle cx="13.4" cy="9.9" r="0.85"/><circle cx="15.7" cy="8.9" r="1.1"/><circle cx="18.1" cy="9.8" r="1.05"/><ellipse cx="15.9" cy="20.5" rx="1.9" ry="1.9"/></g></svg>Today
      </button>
      <button class="tab" data-tab="scr-groups" data-od-id="tab-groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>Groups
      </button>
      <button class="tab" data-tab="scr-leaderboard" data-od-id="tab-leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17.5V21M7 4h10v4.5a5 5 0 0 1-10 0V4Z"/><path d="M7 5.5H4.2v1.6a3.2 3.2 0 0 0 3 3.2M17 5.5h2.8v1.6a3.2 3.2 0 0 1-3 3.2"/></svg>Board
      </button>
      <button class="tab" data-tab="scr-chat" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>Chat
      </button>
      <button class="tab" data-tab="scr-profile" data-od-id="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Profile
      </button>
    </nav>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div><!-- /.phone -->
    </div><!-- /.device-frame -->
  </div><!-- /.fit -->
  <figcaption class="device-caption" data-od-id="device-caption"><b>StrideSquad</b> — tap around, it works</figcaption>
</figure>

<script src="assets/app.js"></script>
</body>
</html>
