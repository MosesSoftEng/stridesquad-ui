    box-shadow:0 0 0 2.5px color-mix(in srgb, var(--primary) 30%, transparent); }
  .gift-item__e { font-size:28px; line-height:1; }
  .gift-item__n { font-size:10.5px; font-weight:800; color:var(--ink); }
  .gift-item__p { font-family:var(--mono); font-size:10px; font-weight:800; color:var(--muted); }
  .gift-item__p.free { color:var(--primary-ink); }
  .msg__bubble .gcard { display:flex; align-items:center; gap:10px; }
  .gcard__stk { font-size:30px; line-height:1; }
  .gcard__t { display:block; font-size:14px; font-weight:800; }
  .gcard__s { display:block; font-size:11.5px; font-weight:700; opacity:.78; margin-top:2px; }
  .sole-pill.bump { animation:sopill-bump .55s ease; }
  @keyframes sopill-bump { 0% { transform:scale(1); } 35% { transform:scale(1.16); background:var(--highlight); border-color:var(--highlight); } 100% { transform:scale(1); } }
  @media (prefers-reduced-motion: reduce) { .sole-pill.bump { animation:none; background:var(--highlight); } }
  .hub-h--link { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .hub-h__go { font-family:var(--mono); font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--primary-ink); min-height:32px; padding:0; }
  .hub-h__go:hover { text-decoration:underline; }
  .field__top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .field__count { font-family:var(--mono); font-size:11px; font-weight:700; color:var(--faint); }
  .field textarea { min-height:92px; padding:12px 16px; border-radius:var(--radius-ctl); border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:16px; font-family:var(--font); line-height:1.45; resize:vertical; }
  .field textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .field select { min-height:50px; padding:0 12px; border-radius:var(--radius-ctl); border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:15px; font-weight:600; }
  .field select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .loc-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .vis-note { font-size:12px; color:var(--faint); margin:-2px 0 10px; }
  .bdy-row .avatar { width:42px; height:42px; }

  /* ═══ v8-g5 · Soles economy ═══ */
  :root {
    --gold:       oklch(0.64 0.13 70);
    --gold-ink:   oklch(0.42 0.10 68);
    --gold-soft:  oklch(0.955 0.045 82);
  }
  .avatar--gold { background: color-mix(in srgb, var(--gold) 26%, var(--surface)); color: var(--ink); }
  .pf-name-row { display:flex; align-items:center; gap:8px; min-width:0; }
  .pf-name-row .screen-title { min-width:0; }
  .chip--plus { min-height:0; padding:2px 8px; font-size:10px; font-weight:800; letter-spacing:.02em;
    background:var(--gold-soft); color:var(--gold-ink);
    border:1.5px solid color-mix(in srgb, var(--gold) 42%, var(--border)); }
  .best-badge { background:var(--highlight); color:var(--ink); border:0; }
  .save-chip { display:inline-block; margin-left:6px; font-size:10.5px; font-weight:800; vertical-align:middle;
    color:var(--gold-ink); background:var(--gold-soft);
    border:1.5px solid color-mix(in srgb, var(--gold) 42%, var(--border)); border-radius:999px; padding:1px 7px; }
  .cap-note { font-size:12.5px; color:var(--muted); margin-top:6px; }
  .rules { display:flex; flex-direction:column; }
  .rule-row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:8px 2px; font-size:13.5px; }
  .rule-row + .rule-row { border-top:1px solid var(--border); }
  .rule-row b { color:var(--ink); font-weight:800; }
  .rule-row span { color:var(--muted); text-align:right; }
  .cap-row { display:flex; gap:9px; align-items:center; margin-top:8px; padding:10px 12px; border-radius:14px;
    background:color-mix(in srgb, var(--muted) 7%, var(--surface)); font-size:12.5px; color:var(--muted); line-height:1.45; }
  .gift-item.owned { border-color:color-mix(in srgb, var(--primary) 45%, var(--border)); background:var(--primary-soft); }
  .gift-item__p.own { color:var(--primary-ink); font-weight:800; }
  .cos-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .cos-card { display:flex; flex-direction:column; gap:9px; padding:13px 12px; border:1.5px solid var(--border);
    border-radius:16px; background:var(--surface); box-shadow:var(--shadow-card); }
  .cos-card.equipped { border-color:color-mix(in srgb, var(--gold) 55%, var(--border)); background:var(--gold-soft); }
  .cos-card__top { display:flex; align-items:center; gap:9px; }
  .cos-e { font-size:22px; line-height:1; flex:none; }
  .cos-n { display:block; font-size:13px; font-weight:800; }
  .cos-p { display:block; font-family:var(--mono); font-size:10.5px; font-weight:800; color:var(--muted); margin-top:2px; }
  .cos-act { min-height:42px; border-radius:999px; font-weight:800; font-size:13px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--muted);
    transition:background .15s ease, color .15s ease, border-color .15s ease; }
  .cos-act--buy { background:var(--primary-deep); border-color:var(--primary-deep); color:var(--on-primary); }
  .cos-act--buy:hover { background:color-mix(in srgb, var(--primary-deep) 86%, var(--ink)); color:var(--on-primary); }
  .cos-act--eq { border-color:color-mix(in srgb, var(--gold) 45%, var(--border)); background:var(--surface); color:var(--gold-ink); }
  .cos-act--eq:hover { background:var(--gold-soft); color:var(--gold-ink); }
  .packs { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .pack-row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 13px;
    border:1.5px solid var(--border); border-radius:16px; background:var(--surface); box-shadow:var(--shadow-card);
    transition:border-color .15s ease; }
  .pack-row:hover { border-color:var(--primary); }
  .pack-row--best { border-color:color-mix(in srgb, var(--highlight) 65%, var(--border)); }
  .pack-e { font-size:24px; line-height:1; flex:none; }
  .pack-t { flex:1; min-width:0; }
  .pack-t b { display:block; font-size:14.5px; font-weight:800; }
  .pack-t span { display:block; font-size:12.5px; color:var(--muted); margin-top:2px; }
  .pack-price { flex:none; font-family:var(--mono); font-size:13px; font-weight:800; color:var(--ink);
    border:1.5px solid var(--border); border-radius:999px; padding:7px 12px; background:var(--bg); }
  .plus-card { margin-top:18px; padding:18px; border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    border:1.5px solid color-mix(in srgb, var(--gold) 45%, var(--border));
    background:linear-gradient(180deg, color-mix(in srgb, var(--gold) 7%, var(--surface)), var(--surface) 55%); }
  .plus-hook { font-size:16px; font-weight:800; letter-spacing:-.01em; }
  .plus-hook-s { font-size:13px; color:var(--muted); margin-top:4px; line-height:1.45; }
  .plan-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .plan-opt { text-align:left; padding:12px; min-height:64px; border:1.5px solid var(--border);
    border-radius:14px; background:var(--surface); transition:border-color .15s ease, background .15s ease; }
  .plan-opt:hover { border-color:color-mix(in srgb, var(--gold) 55%, var(--border)); }
  .plan-opt.sel { border-color:var(--primary-deep); background:var(--primary-soft); }
  .plan-opt b { display:block; font-size:14px; font-weight:800; }
  .plan-opt span { display:block; font-size:12.5px; color:var(--muted); margin-top:3px; }
  .plan-opt small { font-weight:700; }
  .benefits { list-style:none; margin:14px 0 0; padding:0; }
  .benefits li { display:flex; gap:9px; align-items:flex-start; padding:5px 0; font-size:13.5px; color:var(--ink); }
  .benefits li svg { width:16px; height:16px; flex:none; margin-top:3px; color:var(--primary); }
  .plus-cta { margin-top:14px; }
  .plus-state { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; margin-top:14px;
    padding:14px 16px; border-radius:14px; text-align:left;
    background:var(--gold-soft); border:1.5px solid color-mix(in srgb, var(--gold) 42%, var(--border)); }
  .plus-state__t b { display:block; font-size:14.5px; font-weight:800; color:var(--gold-ink); }
  .plus-state__t span { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .plus-state__go { font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--gold-ink); flex:none; }
  .prod-row { display:flex; align-items:center; gap:12px; padding:14px 13px; margin-top:14px;
    border:1.5px solid var(--border); border-radius:16px; background:var(--bg); }
  .prod-row__e { font-size:26px; line-height:1; flex:none; }
  .prod-row__t { flex:1; min-width:0; }
  .prod-row__t b { display:block; font-size:15px; font-weight:800; }
  .prod-row__t span { display:block; font-size:12.5px; color:var(--muted); margin-top:2px; }
  .prod-row__price { flex:none; font-family:var(--mono); font-size:15px; font-weight:800; color:var(--ink); }
  .mock-note { font-size:12px; color:var(--faint); text-align:center; margin-top:10px; }
  .status-chip--on { background:var(--gold-soft); color:var(--gold-ink); border:1px solid color-mix(in srgb, var(--gold) 40%, var(--border)); }
  .toast.spark { animation:tspk .6s ease; }
  @keyframes tspk { 30% { transform:translate(-50%,-5px) scale(1.05); } 100% { transform:translate(-50%,0) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .toast.spark { animation:none; } }
  .plan-opt span.save-chip, .prod-row span.save-chip { display:inline-block; margin-left:6px; }
</style>
</head>
<body>
<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">

        <!-- ══ in-app iOS status bar (desktop only — hidden ≤500px) ══ -->
        <div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>

        <div class="stage" data-od-id="stage">

    <!-- ══ 0 · v7 SPLASH ══ -->
    <section id="scr-splash" class="screen is-visible splash" data-screen data-od-id="splash" aria-label="Splash">
      <div class="splash__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="8.2" rx="3.1" ry="4.4" transform="rotate(-14 9 8.2)"/><ellipse cx="15.6" cy="14" rx="3.1" ry="4.4" transform="rotate(14 15.6 14)"/></svg>
      </div>
      <p class="splash__word">StrideSquad</p>
      <p class="splash__tag">Count steps. Squad up.</p>
      <span class="splash__bar" aria-hidden="true"><i></i></span>
    </section>

    <!-- ══ 1 · ONBOARDING ═══════════════════════════════════════════ -->
    <section id="scr-onboarding" class="screen" data-screen data-od-id="onboarding" aria-label="Onboarding">
      <div class="onb" id="onb-intro">
        <div class="onb__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="8.2" rx="3.1" ry="4.4" transform="rotate(-14 9 8.2)"/><ellipse cx="15.6" cy="14" rx="3.1" ry="4.4" transform="rotate(14 15.6 14)"/></svg>
        </div>
        <p class="onb__brand">StrideSquad</p>
        <h1 class="onb__title">Count steps. Squad up. Climb the leaderboard together.</h1>
        <p class="onb__lead">Join a 10-person squad, see who's walking right now, and turn daily steps into a friendly climb.</p>
        <button class="btn btn--primary btn--block" id="btn-get-started" data-od-id="onboarding-get-started">Get started</button>
        <p class="onb__fine">Prototype with mock data · no account needed</p>
      </div>

      <div class="onb" id="onb-connect" hidden>
        <div class="card health-card" data-od-id="health-connect-card">
          <div class="health-card__row">
            <div class="health-card__glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 12h4l2-6 3.5 12 2-6h5.5"/></svg>
            </div>
            <div>
              <h3 style="font-size:16px;font-weight:800;">Share steps with StrideSquad</h3>
              <p style="font-size:13px;color:var(--muted);margin-top:2px;">Connects to Apple Health or Health Connect</p>
            </div>
          </div>
          <div class="perm-list">
            <p class="perm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>Step count — read</p>
            <p class="perm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>Walking distance — read</p>
            <p class="perm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>Workouts — write summary</p>
          </div>
          <button class="btn btn--primary btn--block" id="btn-allow-health" data-od-id="onboarding-allow">Allow</button>
          <button class="btn btn--text btn--block" id="btn-skip-health">Not now — browse the demo</button>
        </div>
      </div>
    </section>

    <!-- ══ 1b · GOAL FORK ═══════════════════════════════════════════ -->
    <section id="scr-choose" class="screen" data-screen data-od-id="goal-fork" aria-label="Choose your path">
      <div class="onb" style="max-width:360px;">
        <p class="onb__brand">Almost there</p>
        <h1 class="onb__title" style="font-size:31px;">What brings you here?</h1>
        <p class="onb__lead">Pick a starting point — you can change your mind later from Groups or your profile.</p>
      <div class="rail" role="status" aria-label="Setup progress" data-od-id="rail-rail-choose">
        <p class="rail__label" id="rail-choose-label">Step 3 of 5</p>
        <span class="rail__track"><span class="rail__fill" id="rail-choose-fill" style="width:60%"></span></span>
        <span class="rail__steps" aria-hidden="true"><span class="done">Account</span><span>Health</span><span>Path</span><span>Goal</span><span>Start</span></span>
      </div>
        <button class="fork-card" id="btn-fork-squad" data-od-id="fork-squad">
          <span class="fork-card__glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>
          </span>
          <span class="fork-card__t"><b>Squad up</b><span>Join or create a group</span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button class="fork-card" id="btn-fork-solo" data-od-id="fork-solo">
          <span class="fork-card__glyph fork-card__glyph--lime" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="8.2" rx="3.1" ry="4.4" transform="rotate(-14 9 8.2)"/><ellipse cx="15.6" cy="14" rx="3.1" ry="4.4" transform="rotate(14 15.6 14)"/></svg>
          </span>
          <span class="fork-card__t"><b>Just me</b><span>Track my steps against my own goal</span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button class="btn btn--text" id="btn-fork-back" data-od-id="fork-back">← Back to health permissions</button>
      </div>
    </section>

    <!-- ══ 1c · SOLO GOAL SETUP ═════════════════════════════════════ -->
    <section id="scr-goal" class="screen" data-screen data-od-id="goal-setup" aria-label="Set your daily goal">
      <div class="screen-head">
        <div>
          <h2 class="screen-title">Set your goal</h2>
          <p class="screen-sub">A daily target just for you</p>
        </div>
        <button class="icon-btn" data-goto="scr-choose" aria-label="Back" data-od-id="goal-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
        </button>
      </div>

      <div class="rail" role="status" aria-label="Setup progress" data-od-id="rail-rail-goal">
        <p class="rail__label" id="rail-goal-label">Step 4 of 5</p>
        <span class="rail__track"><span class="rail__fill" id="rail-goal-fill" style="width:80%"></span></span>
        <span class="rail__steps" aria-hidden="true"><span class="done">Account</span><span>Health</span><span>Path</span><span>Goal</span><span>Start</span></span>
      </div>
      <div class="card" data-od-id="goal-target-card">
        <p class="card-label">Daily step target</p>
        <div class="goal-chips" id="solo-goal-chips" role="group" aria-label="Quick targets" style="margin-bottom:16px;">
          <button type="button" data-sgoal="6000">6,000</button>
          <button type="button" data-sgoal="7000">7,000</button>
          <button type="button" data-sgoal="8000">8,000</button>
          <button type="button" class="active" data-sgoal="9000">9,000</button>
          <button type="button" data-sgoal="10000">10,000</button>
          <button type="button" data-sgoal="11000">11,000</button>
          <button type="button" data-sgoal="12000">12,000</button>
        </div>
        <p class="goal-hint" style="margin-top:-8px;margin-bottom:6px;"><b>9,000</b> — most squads pick this</p>
        <div class="goal-out"><b id="goal-readout" class="num">9,000</b><span>steps per day</span></div>
        <input class="slider" type="range" id="goal-slider" min="2000" max="20000" step="500" value="9000" aria-label="Custom daily step target">
        <div class="slider-scale"><span>2k</span><span>11k</span><span>20k</span></div>
      </div>

      <div class="card" style="margin-top:14px;" data-od-id="goal-reminder-card">
        <div class="set-row" style="min-height:52px;">
          <div class="set-row__t"><b>Weekly reminder</b><span>Sunday 6pm recap of your week</span></div>
          <button class="switch" role="switch" aria-checked="true" id="sw-weekly" aria-label="Weekly reminder"></button>
        </div>
      </div>

      <button class="btn btn--primary btn--block" id="btn-save-goal" style="margin-top:18px;" data-od-id="goal-save">Save &amp; start tracking</button>
      <p style="font-size:12.5px;color:var(--faint);text-align:center;margin-top:12px;line-height:1.45;">Solo mode hides squad ranks — you can still join a group later from Groups › Discover.</p>
    </section>

    <!-- ══ 2 · TODAY — v8-g1 mission control ══════════════════════ -->
    <section id="scr-today" class="screen" data-screen data-od-id="today" aria-label="Today">
      <div class="util-row" data-od-id="today-util-row">
        <button class="icon-btn bell" data-goto="scr-notif" aria-label="Notifications — 4 unread" data-od-id="today-bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13.5 6 9.5Z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></svg>
          <span class="bell__dot" data-bell-dot aria-hidden="true"></span>
        </button>

    <section id="scr-privacy-policy" class="screen" data-screen data-od-id="privacy-policy" aria-label="Privacy policy">
<div class="screen-head"><div><h2 class="screen-title" style="font-size:23px;">Privacy policy</h2><p class="screen-sub">Plain words. Last updated 3 Nov 2026.</p></div><button class="icon-btn" data-goto="scr-settings-privacy" aria-label="Back" data-od-id="privacy-policy-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button></div>
      <div class="card doc" data-od-id="policy-body">
        <h3>Who we are</h3>
        <p>StrideSquad is a small step-counting app for walking squads. This policy covers the StrideSquad app and its companion services.</p>
        <h3>What we collect</h3>
        <ul>
          <li><b>Account data</b> — your name, email and (hashed) password.</li>
          <li><b>Health data</b> — daily step counts and walking distance, read with your permission. See the panel below.</li>
          <li><b>Activity data</b> — squads you join, messages you send, challenges you enter.</li>
          <li><b>Device data</b> — app version and crash diagnostics, kept minimal.</li>
        </ul>
        <div class="panel" data-od-id="policy-health-panel">
          <h3>Health data</h3>
          <p><b>Steps are read from Health Connect / Apple Health, never used for advertising, never sold.</b> We store daily totals for your leaderboard and streak — not raw health records, not heart rate, not location. You can disconnect the health source any time from Settings &rsaquo; Linked accounts, and the sync stops immediately.</p>
        </div>
        <h3>How we use it</h3>
        <p>Only to run the features you asked for: your goal ring, streaks, squad leaderboards, and the reminders you turned on. No ad SDKs ship in the app — there is nothing to target you with.</p>
        <h3>What your squad sees</h3>
        <p>Members of a squad see your display name, initials, steps and rank. Nothing else. Global boards show a pseudonymous walker card — name, steps, streak — and you can leave the global board from Settings anytime.</p>
        <h3>Sharing</h3>
        <p>We don&rsquo;t sell or rent your data. We share it only if we must, to comply with law or protect safety, and we tell you when we do (unless legally silenced).</p>
        <h3>Retention and deletion</h3>
        <p>Delete your account from Settings &rsaquo; Account and your data is scheduled for erasure within 30 days. Signing back in within that window cancels the erasure. Export what&rsquo;s yours first — Settings &rsaquo; Account &rsaquo; Export my data.</p>
        <h3>Your rights</h3>
        <p>Access, correct, export, object, delete. Do all five from inside the app, or write to support@stridesquad.app and we&rsquo;ll do it for you.</p>
      </div>
    </section>

    <section id="scr-terms" class="screen" data-screen data-od-id="terms" aria-label="Terms of service">
<div class="screen-head"><div><h2 class="screen-title" style="font-size:23px;">Terms of service</h2><p class="screen-sub">Short enough to actually read</p></div><button class="icon-btn" data-goto="scr-settings-privacy" aria-label="Back" data-od-id="terms-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button></div>
      <div class="card doc" data-od-id="terms-body">
        <h3>1 · Acceptance</h3>
        <p>By creating an account you agree to these terms. If you don&rsquo;t agree, don&rsquo;t use the app — no hard feelings.</p>
        <h3>2 · Your account</h3>
        <p>One real account per person. Keep your password to yourself. You can export or delete your account from Settings at any time.</p>
        <h3>3 · Fair walking</h3>
        <p>Steps must come from your own movement via a connected health source. Shaking a phone at a dog or buying fake steps gets your rank hidden from squads and, on repeat, ends the account.</p>
        <h3>4 · Conduct in chats</h3>
        <p>Squad and global rooms are community spaces. Harassment or spam gets you reported, blocked and moderated. Block anyone instantly from a message&rsquo;s options — they vanish from your feeds and land on your blocklist.</p>
        <h3>5 · Not medical advice</h3>
        <p>StrideSquad counts steps. It is not a medical device, and its numbers are not health advice. Check with a professional before changing your training because a leaderboard told you to.</p>
        <h3>6 · Changes and ending</h3>
        <p>If we change these terms we&rsquo;ll tell you in-app first. You can stop anytime; we may stop service with 30 days notice. Sections on data and conduct survive cancellation.</p>
      </div>
    </section>

<script>
(function () {
  'use strict';

  /* ── Screen registry ───────────────────────────────────────────────
     Built by iterating document.querySelectorAll and keying on el.id.
     Never Object.keys(nodeList) — that yields numeric strings and
     silently breaks navigation. */
  var SCREENS = {};
  document.querySelectorAll('.screen').forEach(function (el) {
    SCREENS[el.id] = el;
  });

  var phone   = document.querySelector('.phone');
  var tabs    = Array.prototype.slice.call(document.querySelectorAll('.tab'));

  var enterHooks = {};   // id -> fn, runs each time the screen becomes visible

  /* sub-screens keep their parent tab highlighted */
  var SCREEN_TAB = {
    'scr-group':       'scr-groups',
    'scr-create':      'scr-groups',
    'scr-chat-thread': 'scr-chat',
    'scr-dm-thread':   'scr-chat',
    'scr-achievements': 'scr-today', 'scr-notif': 'scr-today',
    'scr-wallet': 'scr-today', 'scr-nearby': 'scr-today',
    'scr-settings': 'scr-profile', 'scr-settings-account': 'scr-profile',
    'scr-edit-profile': 'scr-profile', 'scr-linked-accounts': 'scr-profile',
    'scr-avatar': 'scr-profile', 'scr-change-password': 'scr-profile', 'scr-settings-notifications': 'scr-profile',
    'scr-settings-privacy': 'scr-profile', 'scr-privacy-policy': 'scr-profile',
    'scr-terms': 'scr-profile', 'scr-blocklist': 'scr-profile',
    'scr-settings-help': 'scr-profile', 'scr-settings-about': 'scr-profile'
  };
  var NO_TABBAR = ['scr-splash', 'scr-onboarding', 'scr-choose', 'scr-goal',
    'scr-signup', 'scr-login', 'scr-forgot', 'scr-reset', 'scr-verify', 'scr-account-deleted'];

  function showScreen(id) {
    if (!SCREENS[id]) return;
    // exactly one visible screen
    Object.keys(SCREENS).forEach(function (key) {
      SCREENS[key].classList.toggle('is-visible', key === id);
    });
    var activeTab = SCREEN_TAB[id] || id;
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === activeTab); });
    phone.classList.toggle('no-tabbar', NO_TABBAR.indexOf(id) !== -1);
    if (enterHooks[id]) enterHooks[id]();
  }

  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () { showScreen(btn.dataset.tab); });
  });

  /* delegated [data-goto] — works for static markup and anything rendered later */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-goto]');
    if (btn) showScreen(btn.dataset.goto);
  });

  function escapeHtml(s) {
    var d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML;
  }

  /* ── toast ────────────────────────────────────────────────────────── */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ── reduce-motion flag ───────────────────────────────────────────── */
  var reduceMotion = false;

  /* ── 1 · onboarding flow ──────────────────────────────────────────── */
  document.getElementById('btn-get-started').addEventListener('click', function () {
    if (!S.signedUp) { showScreen('scr-signup'); return; }   // v7 · auth before health connect
    document.getElementById('onb-intro').hidden = true;
    document.getElementById('onb-connect').hidden = false;
  });
  document.getElementById('btn-allow-health').addEventListener('click', function () {
    S.healthDone = true;                                    // v7 · feeds the progress rail
    toast('Health connected');
    showScreen('scr-choose');   // v6 · goal fork replaces the jump straight to Today
  });
  document.getElementById('btn-skip-health').addEventListener('click', function () {
    showScreen('scr-today');
  });

  /* ── 2 · Today: count-up + self-drawing goal ring ─────────────────── */
  var GOAL = 9000, STEPS = 7842;
  var stepEl  = document.getElementById('step-count');
  var progEl  = document.getElementById('ring-prog');
  var capEl   = document.getElementById('ring-caption');
  var CIRC    = 2 * Math.PI * 88;
  var animToken = 0;

  function setRing(frac) { progEl.style.strokeDashoffset = CIRC * (1 - frac); }

  function animateToday() {
    progEl.style.strokeDasharray = CIRC;
    var token = ++animToken;
    if (reduceMotion) {
      progEl.style.transition = 'none';
      setRing(Math.min(1, STEPS / GOAL));
      stepEl.textContent = STEPS.toLocaleString('en-US');
      return;
    }
    progEl.style.transition = 'none';
    progEl.style.strokeDashoffset = CIRC;   // start empty
    void progEl.getBoundingClientRect();    // force reflow so the draw replays
    progEl.style.transition = 'stroke-dashoffset 1.4s cubic-bezier(.22,.8,.28,1)';
    progEl.style.strokeDashoffset = CIRC * (1 - Math.min(1, STEPS / GOAL));
    stepEl.textContent = '0';
    var t0 = performance.now(), dur = 1400;
    function tick(t) {
      if (token !== animToken) return;      // a newer entry took over
      var p = Math.min(1, (t - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);       // ease-out cubic
      stepEl.textContent = Math.round(STEPS * e).toLocaleString('en-US');
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  enterHooks['scr-today'] = animateToday;

  // weekly sparkline (mock, filled bars)
  var sparkData = [
    { d: 'M', s: 8120 }, { d: 'T', s: 9540 }, { d: 'W', s: 7010 },
    { d: 'T', s: 8860 }, { d: 'F', s: 10210 }, { d: 'S', s: 6450 }, { d: 'S', s: STEPS }
  ];
  var sparkMax = 11000;
  var sparkEl = document.getElementById('week-spark');
  sparkData.forEach(function (w, i) {
    var col = document.createElement('div');
    col.className = 'spark__col' + (i === 6 ? ' spark__col--today' : '');
    var bar = document.createElement('div');
    bar.className = 'spark__bar';
    bar.style.height = Math.round(74 * w.s / sparkMax) + 'px';
    var lbl = document.createElement('span');
    lbl.className = 'spark__lbl';
    lbl.textContent = w.d;
    col.appendChild(bar); col.appendChild(lbl);
    sparkEl.appendChild(col);
  });

  /* ── v5 data model: the user's groups ─────────────────────────────
     d = steps today, w = steps this week. You ("YO") sits in all three
     at a different rank in each. Created groups append to this array. */
  function you() { return { i: 'YO', n: 'You', d: 7842, w: 51972, v: 'slate', you: true }; }

  var GROUPS = [
    { id: 'sunrise', name: 'Sunrise Steppers', code: 'SQUAD10', cap: 10,
      owner: true, up: ['ev-park', 'ev-detour', 'ev-100k'], past: ['ev-fri', 'ev-mon'],
      trend: [62400, 71800, 68100, 75300, 79200, 58800, 76779],
      members: [
        { i: 'MK', n: 'Maya K.',  d: 9120, w: 60934, v: 'lime'  },
        { i: 'PT', n: 'Priya T.', d: 8902, w: 62118, v: ''      },
        { i: 'JO', n: 'Jonas O.', d: 8744, w: 56184, v: 'slate' },
        { i: 'TB', n: 'Tara B.',  d: 8310, w: 58320, v: 'lime'  },
        { i: 'BW', n: 'Ben W.',   d: 7961, w: 50441, v: ''      },
        you(),
        { i: 'LN', n: 'Lena N.',  d: 7420, w: 47600, v: 'lime'  },
        { i: 'CH', n: 'Chris H.', d: 6890, w: 44218, v: ''      },
        { i: 'DK', n: 'Dana K.',  d: 6102, w: 41055, v: 'slate' },
        { i: 'SM', n: 'Sam M.',   d: 5488, w: 38264, v: ''      }
      ] },
    { id: 'office', name: 'Office Steps Challenge', code: 'OFFICE8', cap: 10,
      trend: [41200, 44800, 43100, 47600, 49900, 30400, 49222],
      members: [
        { i: 'NP', n: 'Nina P.',  d: 8120, w: 53400, v: 'lime'  },
        you(),
        { i: 'OM', n: 'Owen M.',  d: 6850, w: 44930, v: ''      },
        { i: 'DK', n: 'Dana K.',  d: 6410, w: 41875, v: 'slate' },
        { i: 'CH', n: 'Chris H.', d: 5980, w: 39204, v: ''      },
        { i: 'LD', n: 'Leo D.',   d: 5240, w: 36612, v: 'lime'  },
        { i: 'MS', n: 'Marta S.', d: 4870, w: 33450, v: ''      },
        { i: 'TO', n: 'Theo B.',  d: 3910, w: 28740, v: 'slate' }
      ] },
    { id: 'duo', name: 'Just Us Two', code: 'DUO22', cap: 2,
      trend: [13900, 15100, 14600, 16200, 15800, 14100, 15147],
      members: [
        you(),
        { i: 'NP', n: 'Nina P.', d: 7305, w: 48210, v: 'lime' }
      ] }
  ];

  function groupById(id) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === id) return GROUPS[i];
    return null;
  }
  function roster(g, key) {
    return g.members.slice().sort(function (a, b) { return b[key] - a[key]; });
  }
  function teamStepsToday(g) {
    return g.members.reduce(function (sum, m) { return sum + m.d; }, 0);
  }
  function yourRank(g, key) {
    var r = roster(g, key);
    for (var i = 0; i < r.length; i++) if (r[i].you) return i + 1;
    return r.length;
  }

  /* tiny weekly-trend sparkline */
  function sparkSvg(trend, w, h) {
    var min = Math.min.apply(null, trend), max = Math.max.apply(null, trend);
    var span = (max - min) || 1;
    var pts = trend.map(function (v, i) {
      var x = (i * w / (trend.length - 1)).toFixed(1);
      var y = (h - 3 - (v - min) / span * (h - 6)).toFixed(1);
      return x + ',' + y;
    });
    return '<svg class="spark-mini" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
      '" fill="none" aria-hidden="true"><polyline points="' + pts.join(' ') +
      '" stroke="var(--primary-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

  /* ── 3 · My Groups: card list → group detail ──────────────────────── */
  var groupsListEl = document.getElementById('groups-list');
  var mgSubEl = document.getElementById('mg-sub');

  function avatarStack(g) {

  /* seeded mock rows — stable while you scroll, plausibly descending */
  function lbSeed(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function initialsOf(n) { var t = n.replace(/\./g, ' ').trim().split(/\s+/); return (t[0][0] + (t[1] || t[0][1] || 'W')[0]).toUpperCase(); }

  function lbBaseSeries(range) {
    if (lbBaseCache[range]) return lbBaseCache[range];

    var daily = range === 'daily';

      rows.push({ n: name, i: initialsOf(name), v: LB_VS[i % LB_VS.length], s: cur });

  /* grouped rendering: chip + colored name above the FIRST bubble of a sender run,
     time rides the LAST bubble, day separators between days. */
  function buildThread(host, msgs, ctx) {
    host.innerHTML = '';
    var lastDay = null, grp = null;
    function startGroup(side, sender) {
      var row = document.createElement('div');
      row.className = 'msg msg--' + side;
      row.innerHTML = '<span class="msg__chipSlot">' + (side === 'out' ? outChipHtml() : inChipHtml({ who: sender, i: sender.slice(0, 2).toUpperCase(), v: '' })) + '</span>' +
        '<div class="msg__col"><div class="msg__who"><span class="msg__name" style="color:' + tintOf(sender) + '">' + escapeHtml(sender) + '</span></div></div>';
      host.appendChild(row);
      grp = { sender: sender, side: side, col: row.querySelector('.msg__col'), lastBubble: null };
    }
    msgs.forEach(function (m) {
      if (m.sys) {
        grp = null;
        var sys = document.createElement('div');
        sys.className = 'syscard';
        sys.setAttribute('data-od-id', 'chat-teamup-card');
        sys.innerHTML =
          '<b>Team up</b><p>These runners are all within 2k steps of you. Create a group and keep the race going.</p>' +
          '<button class="btn btn--primary" type="button" data-goto="scr-create">Team up — create a group with these runners</button>';
        host.appendChild(sys);
        return;
      }
      var day = dayOf(m);
      if (day !== lastDay) {
        grp = null;
        var sep = document.createElement('div');
        sep.className = 'chat-day';
        sep.setAttribute('data-od-id', 'chat-day-' + day);
        sep.textContent = dayLabel(day);
        host.appendChild(sep);
        lastDay = day;
      }
      var side = (m.s === 'out') ? 'out' : 'in';
      var sender = m.who || (side === 'out' ? 'You' : 'Walker');
      if (m.ev && !eventById(m.ev)) return;      // cancelled event — card gone, group untouched
      if (!grp || grp.sender !== sender || grp.side !== side) {
        if (side === 'in' && !grp) { /* noop */ }
        startGroup(side, sender);
        if (side === 'in') host.lastElementChild.querySelector('.msg__chipSlot').innerHTML = inChipHtml(m);
      }
      var line = document.createElement('div');
      line.className = 'msg__line';
      line.setAttribute('data-mid', m.mid);
      line.setAttribute('data-sender', sender);
      line.setAttribute('data-own', side === 'out' ? '1' : '0');
      line.setAttribute('data-od-id', (m.ev ? (ctx.dm ? 'dm-eventcard-' : 'chat-eventcard-') : (ctx.dm ? 'dm-message-' : 'chat-message-')) + m.mid);
      var menuBtn = '<button class="msg__menu" aria-label="Message options">' + MENU_SVG + '</button>';
      if (m.ev) {
        var ev = eventById(m.ev);
        line.innerHTML = '<div class="evcard evcard--chat">' + evChatHtml(ev) + '</div>' + menuBtn;
        grp.col.appendChild(line);
        return;
      }
      line.innerHTML = '<div class="msg__bubble"></div>' + menuBtn;
      var bubble = line.querySelector('.msg__bubble');
      if (m.ph !== undefined) {
        bubble.classList.add('msg__bubble--img');
        bubble.innerHTML = '<figure class="phcard" style="margin:0;">' + demoPhotoSvg(m.ph) +
          '<figcaption class="phcard__cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4.5 17 4.5-4.5 3.5 3 3-2 4 3.5"/></svg>Photo · demo</figcaption></figure>';
      } else if (m.gift) {
        bubble.innerHTML = '<span class="gcard"><span class="gcard__stk" aria-hidden="true">🎁 ' + m.gift.e + '</span><span><b class="gcard__t">' + escapeHtml(m.gift.n) + '</b><span class="gcard__s">from You</span></span></span>';
      } else {
        bubble.textContent = m.text;           // never trust innerHTML for message text
      }
      var prevB = grp.lastBubble;
      if (prevB && prevB !== bubble) { var old = prevB.querySelector('.msg__time'); if (old) old.remove(); }
      var ts = document.createElement('span');
      ts.className = 'msg__time';
      ts.textContent = m.t;
      bubble.appendChild(ts);
      grp.lastBubble = bubble;
      grp.col.appendChild(line);
    });
    grp = null;
  }

  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function drawQr(text) {
    var svg = document.getElementById('qr-svg');
    if (!svg) return;
    var h = hashStr(String(text)), cells = 21, out = '';
    function inFinder(x, y) { return (x < 8 && y < 8) || (x >= cells - 8 && y < 8) || (x < 8 && y >= cells - 8); }
    for (var y = 0; y < cells; y++) {
      for (var x = 0; x < cells; x++) {
        var on;
        if (inFinder(x, y)) {
          var fx = x < 8 ? x : x - (cells - 8);
          var fy = y < 8 ? y : y - (cells - 8);
          on = (fx <= 6 && fy <= 6) &&
            ((fx === 0 || fx === 6 || fy === 0 || fy === 6) || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4));
        } else {
          h = Math.imul(h ^ (x * 31 + y * 7), 2654435761) >>> 0;
          on = (h % 100) < 46;
        }
        if (on) out += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
      }
    }
    svg.innerHTML = out;
  }

    var info = USER_INFO[row.n];
    var seed = lbSeed('g4|' + row.n);
    var rnd = mulberry32(seed);
    var streak = info ? info.streak : 4 + Math.floor(rnd() * 40);
    var badges = (info && info.badges.length) ? info.badges : [BADGE_POOL[Math.floor(rnd() * BADGE_POOL.length)]];

    { n: 'Grass',      c: '#16A34A', sh: '#127C39', lock: -1 },
    { n: 'Lime',       c: '#A3E635', sh: '#65A30D', lock: -1 },
    { n: 'Amber',      c: '#F59E0B', sh: '#B45309', lock: -1 },
    { n: 'Slate',      c: '#64748B', sh: '#334155', lock: -1 },
    { n: 'Dawn',       c: '#F472B6', sh: '#BE185D', lock: 4 },
    { n: 'Gold Dust',  c: '#EAB308', sh: '#A16207', lock: 5 }
  ];
  var AV_HATS = [
    { n: 'None',          av: -1 },
    { n: 'Trail Cap',     av: 0 },
    { n: 'Sunset Visor',  av: 1 },
    { n: 'Ridge Helmet',  av: 2 },
    { n: 'Safari Hat',    av: 3 }
  ];
  var AV_FACE_N = 5;
  var avSel = { body: 0, face: 0, hat: 0 };
  function avBodyOwned(bi) { var lk = AV_BODIES[bi].lock; return lk < 0 || !!SOLE.ownedAv[lk]; }
  function avHatOwned(hi) { var av = AV_HATS[hi].av; return av < 0 || !!SOLE.ownedAv[av]; }
  function avLockPrice(avIdx) { return (avIdx >= 0 && AVATARS[avIdx]) ? AVATARS[avIdx].p + ' 👟' : ''; }

  function avFaceMarkup(f, ink) {
    if (f === 1) return '<circle cx="40" cy="49" r="4.2" fill="' + ink + '"/><circle cx="60" cy="49" r="4.2" fill="' + ink + '"/><ellipse cx="50" cy="63" rx="6.5" ry="5.4" fill="' + ink + '"/><path d="M45.5 66q4.5 2.6 9 0" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
    if (f === 2) return '<circle cx="40" cy="50" r="3.4" fill="' + ink + '"/><path d="M55 50q5-4.5 10 0" stroke="' + ink + '" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M40 61q10 7 20 0" stroke="' + ink + '" stroke-width="3.4" stroke-linecap="round" fill="none"/>';
    if (f === 3) return '<path d="M35.5 48h9M55.5 48h9" stroke="' + ink + '" stroke-width="3.4" stroke-linecap="round"/><path d="M42 60q8 5 16 0" stroke="' + ink + '" stroke-width="3.2" stroke-linecap="round" fill="none"/>';
    if (f === 4) return '<circle cx="40" cy="50" r="2.6" fill="' + ink + '"/><circle cx="60" cy="50" r="2.6" fill="' + ink + '"/><path d="M43 57q7 10 14 0Z" fill="' + ink + '"/>';
    return '<circle cx="40" cy="50" r="3.4" fill="' + ink + '"/><circle cx="60" cy="50" r="3.4" fill="' + ink + '"/><path d="M40 61q10 7 20 0" stroke="' + ink + '" stroke-width="3.4" stroke-linecap="round" fill="none"/>';
  }
  function avHatMarkup(hi) {
    if (hi === 1) return '<path d="M28 33C28 21 37 14 50 14s22 7 22 19c0 1.7-1.4 3-3.2 3H31.2C29.4 36 28 34.7 28 33Z" fill="#1E3A5F"/><path d="M70 36c9 0 15 2.4 15 5.2s-6 4-14.5 3.3Z" fill="#16324F"/><circle cx="50" cy="14.5" r="2.6" fill="#16324F"/>';
    if (hi === 2) return '<path d="M27 31a23 21 0 0 1 46 0l-6 2a17 15 0 0 0-34 0Z" fill="#F97316"/><path d="M71 33c8 .6 13 3 12.6 5.6-.4 2.6-6.6 3.2-14 2Z" fill="#EA580C"/>';
    if (hi === 3) return '<path d="M29 34c0-12 9-20 21-20s21 8 21 20c0 1.7-1.3 3-3 3H32c-1.7 0-3-1.3-3-3Z" fill="#334155"/><path d="M40 18l2 14M50 15l0 17M60 18l-2 14" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/><rect x="27" y="34" width="46" height="4.6" rx="2.3" fill="#0F172A"/>';
    if (hi === 4) return '<path d="M33 30c0-9 7.5-15 17-15s17 6 17 15c0 1.5-1.2 2.6-2.7 2.6H35.7C34.2 32.6 33 31.5 33 30Z" fill="#8C6A3F"/><ellipse cx="50" cy="34" rx="30" ry="5" fill="#A87F4B"/><path d="M33 31h34" stroke="#6B4F2A" stroke-width="2"/>';
    return '';
  }
  function avCharSvg(sel, size) {
    var b = AV_BODIES[sel.body % AV_BODIES.length] || AV_BODIES[0];
    var uid = 'ac' + (++PH_SEQ);
    var INK = '#1F2430';
    var s = '<svg class="avchar" viewBox="0 0 100 100" width="' + size + '" height="' + size + '" aria-hidden="true">';
    s += '<defs>'
      + '<linearGradient id="dsk' + uid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + b.c + '" stop-opacity=".18"/><stop offset="1" stop-color="' + b.c + '" stop-opacity=".4"/></linearGradient>'
      + '<linearGradient id="bdy' + uid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + b.c + '"/><stop offset="1" stop-color="' + b.sh + '"/></linearGradient>'
      + '<radialGradient id="gl' + uid + '" cx="34%" cy="26%" r="72%"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset="55%" stop-color="#fff" stop-opacity="0"/></radialGradient>'
      + '</defs>';
    s += '<circle cx="50" cy="50" r="49" fill="url(#dsk' + uid + ')"/>';
    s += '<ellipse cx="50" cy="86.5" rx="25" ry="5" fill="' + b.sh + '" opacity=".2"/>';
    s += '<ellipse cx="38.5" cy="83" rx="7" ry="4.4" fill="' + b.sh + '"/><ellipse cx="61.5" cy="83" rx="7" ry="4.4" fill="' + b.sh + '"/>';
    s += '<path d="M50 20c17 0 29 13 29 31 0 18-12 30.5-29 30.5S21 69 21 51C21 33 33 20 50 20Z" fill="url(#bdy' + uid + ')"/>';
    s += '<path d="M50 20c17 0 29 13 29 31 0 18-12 30.5-29 30.5S21 69 21 51C21 33 33 20 50 20Z" fill="url(#gl' + uid + ')"/>';
    s += avFaceMarkup(sel.face % AV_FACE_N, INK);
    s += avHatMarkup(sel.hat % AV_HATS.length);
    s += '</svg>';
    return s;
  }

  /* one avatar state → profile header, leaderboard You-row, edit-profile, own chat chips, user sheet */
  function paintYouAvatars() {
    [['pf-avatar', 'avatar avatar--lg', 56], ['ep-preview', 'avatar avatar--lg', 56], ['lby-av', 'avatar', 40]].forEach(function (p) {
      var el = document.getElementById(p[0]);
      if (!el) return;
      el.className = p[1] + (S.avChar ? ' avatar--char' : (S.avV ? ' avatar--' + S.avV : ''));
      if (S.avChar) el.innerHTML = avCharSvg(S.avChar, p[2]);
      else el.textContent = S.avI;
    });
    var vis = document.querySelector('.screen.is-visible');
    if (vis && vis.id === 'scr-chat-thread') renderThread();
    if (vis && vis.id === 'scr-dm-thread') renderDm();
  }

  function avOptBtn(cls, idx, inner, label, active, locked, priceTxt, onPick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'avgen-opt' + cls + (active ? ' active' : '') + (locked ? ' locked' : '');
    b.setAttribute('aria-label', label);
    b.innerHTML = inner;
    b.addEventListener('click', function () {
      if (locked) {
        toast('Locked — grab it in the Sole store for ' + priceTxt);
        setWalletTab('avatar');
        showScreen('scr-wallet');
        return;
      }
      onPick();
    });
    return b;
  }
  function renderAvGen() {
    var stage = document.getElementById('avgen-stage');
    stage.innerHTML = avCharSvg(avSel, 240);
    var bodies = document.getElementById('avgen-bodies');
    bodies.innerHTML = '';
    AV_BODIES.forEach(function (b, bi) {
      var owned = avBodyOwned(bi);
      bodies.appendChild(avOptBtn('', bi,
        '<span class="avgen-opt__sw" style="background:' + b.c + '"></span><span class="avgen-opt__p">' + (owned ? escapeHtml(b.n) : avLockPrice(b.lock)) + '</span>',
        b.n + (owned ? ' body color' : ' — locked, ' + avLockPrice(b.lock)),
        avSel.body === bi, !owned, avLockPrice(b.lock),
        function () { avSel.body = bi; renderAvGen(); }));
    });
    var faces = document.getElementById('avgen-faces');
    faces.innerHTML = '';
    var FLABEL = ['Smile', 'Happy', 'Wink', 'Focused', 'Cheerful'];
    for (var f = 0; f < AV_FACE_N; f++) {
      (function (fi) {
        faces.appendChild(avOptBtn('', fi,
          '<span class="avgen-opt__ic">' + avCharSvg({ body: 3, face: fi, hat: 0 }, 26) + '</span><span class="avgen-opt__p">' + FLABEL[fi] + '</span>',
          FLABEL[fi] + ' face', avSel.face === fi, false, '',
          function () { avSel.face = fi; renderAvGen(); }));
      })(f);
    }
    var hats = document.getElementById('avgen-hats');
    hats.innerHTML = '';
    AV_HATS.forEach(function (h, hi) {
      var owned = avHatOwned(hi);
      var price = h.av >= 0 ? avLockPrice(h.av) : '';
      hats.appendChild(avOptBtn('', hi,
        '<span class="avgen-opt__ic">' + avCharSvg({ body: avSel.body, face: avSel.face, hat: hi }, 26) + '</span><span class="avgen-opt__p">' + (owned ? escapeHtml(h.n) : price) + '</span>',
        h.n + (owned ? ' hat' : ' — locked, ' + price),
        avSel.hat === hi, !owned, price,
        function () { avSel.hat = hi; renderAvGen(); }));
    });
  }
  function shuffleAv() {
    var bodyPool = [], hatPool = [];
    AV_BODIES.forEach(function (b, i) { if (avBodyOwned(i)) bodyPool.push(i); });
    AV_HATS.forEach(function (h, i) { if (avHatOwned(i)) hatPool.push(i); });
    for (var tries = 0; tries < 25; tries++) {
      var nb = bodyPool[Math.floor(Math.random() * bodyPool.length)];
      var nf = Math.floor(Math.random() * AV_FACE_N);
      var nh = hatPool[Math.floor(Math.random() * hatPool.length)];
      var diff = (nb !== avSel.body ? 1 : 0) + (nf !== avSel.face ? 1 : 0) + (nh !== avSel.hat ? 1 : 0);
      if (diff >= 2) { avSel = { body: nb, face: nf, hat: nh }; break; }
    }
    renderAvGen();
  }
  var avatarBackTo = 'scr-profile';
  function openAvGen(shuffleFirst) {
    avSel = S.avChar ? { body: S.avChar.body, face: S.avChar.face, hat: S.avChar.hat } : { body: 0, face: 0, hat: 0 };
    renderAvGen();
    if (shuffleFirst) shuffleAv();
    showScreen('scr-avatar');
  }
  document.getElementById('btn-change-avatar').addEventListener('click', function () { avatarBackTo = 'scr-edit-profile'; openAvGen(false); });
  document.getElementById('btn-wallet-av-shuffle').addEventListener('click', function () { avatarBackTo = 'scr-wallet'; openAvGen(true); });
  document.getElementById('btn-avatar-back').addEventListener('click', function () { showScreen(avatarBackTo); });
  document.getElementById('btn-av-shuffle').addEventListener('click', shuffleAv);
  document.getElementById('btn-av-save').addEventListener('click', function () {
    S.avChar = { body: avSel.body, face: avSel.face, hat: avSel.hat };
    paintYouAvatars();
    renderHub();
    toast('Avatar saved — profile, board and chat updated');
  });
  document.getElementById('btn-av-reset').addEventListener('click', function () {
    S.avChar = null;
    renderAvGen();
    paintYouAvatars();
    toast('Back to your initials');
  });
  var USER_AV_DEFAULT = document.getElementById('user-av').innerHTML;

  renderNotif();
  renderNearby();
  syncBellDots();

  /* ── device presentation: scale the frame to fit the viewport ─────
     Desktop only. ≤500px the CSS media query dissolves the frame and
     the app fills 100dvh, so we hand the sizing back to CSS. */
  var fitBox  = document.querySelector('.fit');
  var frameEl = document.querySelector('.device-frame');
  var mqMobile = window.matchMedia('(max-width: 500px)');
  var DW = 413, DH = 872;                 // bezel outer size (393×852 screen + 2×10px)
  function fitDevice() {
    if (mqMobile.matches) {
      frameEl.style.transform = '';
      fitBox.style.width = '';
      fitBox.style.height = '';
      return;
    }
    var s = Math.min(1, (window.innerWidth - 48) / DW, (window.innerHeight - 130) / DH);
    if (!isFinite(s) || s <= 0) s = 1;
    frameEl.style.transform = 'scale(' + s + ')';
    fitBox.style.width  = Math.round(DW * s) + 'px';
    fitBox.style.height = Math.round(DH * s) + 'px';
  }
  window.addEventListener('resize', fitDevice);
  if (mqMobile.addEventListener) mqMobile.addEventListener('change', fitDevice);
  fitDevice();

  /* boot: every data-driven screen renders eagerly — never blank */
  renderGroups();
  renderHub();
  renderDiscover();
  refreshTodayGoal();
  drawQr(document.getElementById('invite-link').textContent.trim());
  bootSplash();
})();
</script>
</body>
</html>
