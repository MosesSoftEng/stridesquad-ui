<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StrideSquad — Interactive Prototype v8</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="user" data-screen="scr-user">

<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">
<div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
<div class="stage">
<section id="scr-user" class="screen" data-screen data-od-id="user-profile" aria-label="Walker profile">

            <header class="appbar" data-od-id="appbar">
        <button class="icon-btn appbar__back" id="btn-user-back" aria-label="Back" data-od-id="user-back">
            <svg class="ico" aria-hidden="true"><use href="#ic-arrow-left"></use></svg>
          </button>
        <div class="appbar__text">
          <b class="appbar__title" id="appbar-title">Walker profile</b>
          <span class="appbar__mini" id="user-head-sub">Walker card</span>
        </div>
        <button class="icon-btn appbar__act" id="btn-user-menu" type="button" aria-label="Report or block this walker" aria-haspopup="dialog" data-od-id="user-menu">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button> <button class="icon-btn bell appbar__bell" id="appbar-bell" type="button" data-goto="scr-notif" aria-label="Notifications — 4 unread" data-od-id="appbar-bell"><svg class="ico" aria-hidden="true"><use href="#ic-bell"></use></svg><span class="bell__dot" data-bell-dot aria-hidden="true"></span></button> <button class="sole-pill appbar__coin" id="appbar-coin" type="button" data-goto="scr-wallet" aria-label="Sole wallet — 128 coins, up 12 today" data-od-id="appbar-coin"><svg class="ico" aria-hidden="true"><use href="#ic-coin"></use></svg><b class="num">128</b><i>+12 today</i></button>
      </header>
<div class="u-hero">
        <div class="uav" id="user-av" aria-hidden="true">
          <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <path d="M50 26c0-8 5.5-11.5 12-12.5-1 8-5 12-12 12.5Z" fill="currentColor" opacity=".5"/>
            <circle cx="37" cy="44" r="5.4" fill="currentColor"/>
            <circle cx="63" cy="44" r="5.4" fill="currentColor"/>
            <path d="M31 61c5.5 7.5 12.3 11 19 11s13.5-3.5 19-11" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
            <circle cx="22" cy="57" r="6.5" fill="currentColor" opacity=".16"/>
            <circle cx="78" cy="57" r="6.5" fill="currentColor" opacity=".16"/>
          </svg>
          <span class="uav__tag" id="user-ini">YO</span>
        </div>
        <h3 class="u-name" id="user-name">Walker</h3>
        <span class="chip u-city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.4-6.5-10a6.5 6.5 0 0 1 13 0c0 4.6-6.5 10-6.5 10Z"/><circle cx="12" cy="11" r="2.4"/></svg><span id="user-city-n">Nairobi</span></span>
        <p class="u-rank" id="user-rank">—</p>
      </div>
      <div class="user-stats" data-od-id="user-stat-trio">
        <div><b class="num" id="user-avg">—</b><span>weekly avg</span></div>
        <div><b class="num" id="user-best">—</b><span>best day</span></div>
        <div><b id="user-since">—</b><span>member since</span></div>
      </div>
      <div class="u-streak" data-od-id="user-streak-row">
        <span class="u-streak__flame" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="#ic-flame"></use></svg></span>
        <span><b class="num" id="user-streak">—</b> day streak</span>
        <i id="user-streak-best">best —</i>
      </div>
      <div class="ubadges" id="user-badges" data-od-id="user-badges"></div>
      <p class="u-share u-hide" id="user-share" data-od-id="user-shared-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>
        <span>You both are in <b id="user-share-g">Sunrise Steppers</b></span>
      </p>
      <div class="u-actions" data-od-id="user-action-bar">
        <button type="button" class="uact uact--primary" id="btn-user-msg" data-od-id="user-message">Message</button>
        <button type="button" class="uact" id="btn-user-gift" data-od-id="user-gift">Gift <svg class="ico" aria-hidden="true"><use href="#ic-gift"></use></svg></button>
        <button type="button" class="uact" id="btn-user-buddy" data-od-id="user-buddy">+ Buddy</button>
      </div>
    </section>
</div><!-- /.stage -->
<nav class="tabbar" aria-label="Main navigation" data-od-id="tabbar">
      <button class="tab" data-tab="scr-today" data-od-id="tab-today">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="rotate(-12 8.2 10.5)"><ellipse cx="8.2" cy="10.9" rx="2.7" ry="3.6"/><circle cx="6.1" cy="5.5" r="1.05"/><circle cx="8.6" cy="4.6" r="1.1"/><circle cx="11.1" cy="5.6" r="0.85"/><ellipse cx="8.4" cy="16.6" rx="1.9" ry="2.1"/></g><g transform="rotate(12 15.8 14.5)"><ellipse cx="15.8" cy="14.9" rx="2.7" ry="3.6"/><circle cx="13.4" cy="9.9" r="0.85"/><circle cx="15.7" cy="8.9" r="1.1"/><circle cx="18.1" cy="9.8" r="1.05"/><ellipse cx="15.9" cy="20.5" rx="1.9" ry="1.9"/></g></svg>Today
      </button>
      <button class="tab" data-tab="scr-groups" data-od-id="tab-groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>Groups
      </button>
      <button class="tab" data-tab="scr-leaderboard" data-od-id="tab-leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17.5V21M7 4h10v4.5a5 5 0 0 1-10 0V4Z"/><path d="M7 5.5H4.2v1.6a3.2 3.2 0 0 0 3 3.2M17 5.5h2.8v1.6a3.2 3.2 0 0 1-3 3.2"/></svg>Board
      </button>
      <button class="tab" data-tab="scr-chat" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>Chat
      </button>
      <button class="tab" data-tab="scr-profile" data-od-id="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Profile
      </button>
    </nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="user-menu-sheet" role="dialog" aria-modal="true" aria-label="Profile options" data-od-id="user-menu-sheet">
      <div class="sheet__grab" aria-hidden="true"></div>
      <h3 id="user-menu-title" style="margin-bottom:6px;">Options</h3>
      <button class="btn btn--danger btn--block" id="btn-user-report" data-od-id="user-report">Report</button>
      <button class="btn btn--danger btn--block" id="btn-user-block" data-od-id="user-block">Block</button>
      <button class="btn btn--cancel btn--block" id="btn-user-menu-cancel">Cancel</button>
    </div>
<div class="sheet" id="gift-sheet" role="dialog" aria-modal="true" aria-label="Send a gift" data-od-id="gift-sheet">
      <div class="sheet__grab" aria-hidden="true"></div>
      <button class="sheet__x" type="button" id="btn-gift-close" aria-label="Close gift picker" data-od-id="gift-sheet-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg></button>
      <h3>Send a gift</h3>
      <p>To <b id="gift-peer">Nina P.</b> — it lands in your chat as a gift card.</p>
      <div class="gift-grid" id="gift-grid" role="group" aria-label="Gift stickers" data-od-id="gift-grid"></div>
      <button class="btn btn--primary btn--block" id="btn-gift-send" style="margin-top:14px;" disabled data-od-id="gift-send">Send</button>
      <p style="font-size:12px;color:var(--faint);text-align:center;margin-top:10px;">Premium stickers cost <svg class="ico" aria-hidden="true"><use href="#ic-coin"></use></svg> — the first four are free</p>
    </div>
<div class="sheet" id="report-sheet" role="dialog" aria-modal="true" aria-label="Message options" data-od-id="report-sheet">
      <div class="sheet__grab" aria-hidden="true"></div>
      <h3 id="report-sheet-title" style="margin-bottom:6px;">Message options</h3>
      <button class="btn btn--danger btn--block" id="btn-report" data-od-id="report-confirm">Report</button>
      <button class="btn btn--danger btn--block" id="btn-block" data-od-id="block-confirm">Block sender</button>
      <button class="btn btn--cancel btn--block" id="btn-report-cancel">Cancel</button>
    </div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div><!-- /.phone -->
    </div><!-- /.device-frame -->
  </div><!-- /.fit -->
  <figcaption class="device-caption" data-od-id="device-caption"><b>StrideSquad</b> — tap around, it works</figcaption>
</figure>

<script src="assets/app.js"></script>
</body>
</html>
