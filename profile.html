<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StrideSquad — Interactive Prototype v8</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="profile" data-screen="scr-profile">

<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">
<div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
<div class="stage">
<section id="scr-profile" class="screen" data-screen data-od-id="profile" aria-label="Profile">
      <div class="util-row" data-od-id="profile-util-row">
        <button class="icon-btn bell" data-goto="scr-notif" aria-label="Notifications — 4 unread" data-od-id="profile-bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13.5 6 9.5Z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></svg>
          <span class="bell__dot" data-bell-dot aria-hidden="true"></span>
        </button>
        <div class="util-row__end">
          <button class="sole-pill" data-goto="scr-wallet" aria-label="Sole wallet — 128 coins, up 12 today" data-od-id="profile-sole-pill"><svg class="ico" aria-hidden="true"><use href="#ic-footprint"></use></svg><b class="num">128</b> ·<i>+12 today</i></button>
        </div>
      </div>
      <div class="screen-head">
        <div class="row" style="display:flex;align-items:center;gap:14px;">
          <div class="avatar avatar--lg" id="pf-avatar" aria-hidden="true">YO</div>
          <div style="min-width:0;">
            <div class="pf-name-row"><h2 class="screen-title" style="font-size:22px;" id="pf-name">You</h2><span class="chip chip--plus u-hide" id="pf-plus-chip" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="#ic-spark"></use></svg> StrideSquad+</span></div>
            <p class="screen-sub">12-day streak · 6th in Sunrise Steppers</p>
            <p class="pf-userline" id="pf-userline" hidden></p>
            <p class="pf-userline" id="pf-bio" hidden></p>
            <button type="button" class="chip chip--buddies" style="margin-top:8px;" data-goto="scr-buddies" data-od-id="profile-buddies-chip" aria-label="Open your buddies board">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>
              <span id="pf-buddies-chip-n">3 Buddies</span>
            </button>
          </div>
        </div>
        <button class="icon-btn" data-goto="scr-settings" aria-label="Settings" data-od-id="profile-settings-gear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.56-2-3.46-2.35.95a7 7 0 0 0-2.42-1.4L13.7 3h-3.4l-.4 2.53a7 7 0 0 0-2.41 1.4l-2.36-.95-2 3.46 2 1.56A7.1 7.1 0 0 0 5 12c0 .48.05.95.14 1.4l-2 1.57 2 3.46 2.35-.95a7 7 0 0 0 2.42 1.4l.39 2.52h3.4l.4-2.52a7 7 0 0 0 2.41-1.4l2.36.95 2-3.46-2-1.57c.09-.45.13-.92.13-1.4Z"/></svg>
        </button>
      </div>

      <div class="nudge" id="profile-nudge" data-od-id="profile-complete-nudge" role="status">
        <svg class="nudge__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16.3" r=".9" fill="currentColor" stroke="none"/></svg>
        <b id="nudge-b">Profile · 4 of 5 · 80%</b>
        <button class="nudge__go" type="button" id="btn-nudge-photo" data-goto="scr-edit-profile" data-od-id="profile-nudge-photo">Add photo <svg class="ico" aria-hidden="true"><use href="#ic-arrow-right"></use></svg></button>
      </div>

      <div class="pf-lock u-hide" id="pf-lock-note" role="status" data-od-id="profile-lock-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span>You're hidden from Nearby &amp; boards — <button type="button" data-goto="scr-edit-profile" data-od-id="profile-lock-fix">turn it back on in Edit profile</button></span>
      </div>

      <div id="pf-ach-block" data-od-id="profile-achievements">
        <p class="card-label">Achievements</p>
        <div class="ach-scroll">
          <div class="ach"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2c.6 3-1.2 4.6-2.6 6C9 9.6 7.5 11.4 7.5 14a6.5 6.5 0 0 0 13 .3c-.3-2.9-2.2-4.6-3.4-6.3-.4 1-1.1 1.8-2 2.2.8-2.8.2-6.2-1.6-8.2Z"/></svg><b>12 in a row</b><span>Two weeks of daily streaks</span></div>
          <div class="ach"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h4l2-6 3.5 12 2-6h5.5"/></svg><b>Goal crusher</b><span>Hit 9,000 five days this week</span></div>
          <div class="ach"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><b>Dawn patrol</b><span>10 mornings under 7am</span></div>
          <div class="ach"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 9 9l4 5 3-3 4 9Z"/></svg><b>Hill taker</b><span>120 floors this month</span></div>
          <div class="ach ach--locked"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><b>Podium week</b><span>Top 3 in squad for 7 days</span></div>
          <div class="ach ach--locked"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3.5c4 5 4 12 0 17-4-5-4-12 0-17Z"/></svg><b>Global top 100</b><span>Climb the weekly global board</span></div>
        </div>
      </div>

      <div class="card" style="margin-top:6px;" data-od-id="profile-settings">
        <p class="card-label">Settings</p>
        <div class="set-row">
          <div class="set-row__t"><b>Daily nudge</b><span>Remind me at 7pm if I'm under goal</span></div>
          <button class="switch" role="switch" aria-checked="true" id="sw-nudge" aria-label="Daily nudge" data-od-id="settings-toggle-nudge"></button>
        </div>
        <div class="set-row">
          <div class="set-row__t"><b>Reduce motion</b><span>Skip the ring and count-up animations</span></div>
          <button class="switch" role="switch" aria-checked="false" id="sw-motion" aria-label="Reduce motion" data-od-id="settings-toggle-motion"></button>
        </div>
        <div class="set-row">
          <div class="set-row__t"><b>Show step goal on board</b><span>Visible to your squad only</span></div>
          <button class="switch" role="switch" aria-checked="false" id="sw-visible" aria-label="Show step goal on board" data-od-id="settings-toggle-visible"></button>
        </div>
      </div>

      <button class="gcta" style="margin-top:14px;" id="btn-profile-discover" data-od-id="profile-discover-link">
        <span class="gcta__t">
          <svg class="ico" aria-hidden="true"><use href="#ic-globe"></use></svg>
          <span><b>Find a squad</b><span>Browse public groups · join by request</span></span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>

      <button class="gcta" id="btn-profile-buddies" data-goto="scr-buddies" data-od-id="profile-buddies-link">
        <span class="gcta__t">
          <svg class="ico" aria-hidden="true"><use href="#ic-users-plus"></use></svg>
          <span><b>Buddies</b><span class="s">Cheers, gifts and requests · <span id="pf-buddy-count">3</span> buddies</span></span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>

      <div class="card" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;" data-od-id="profile-health">
        <div><b style="font-size:15px;">Health source</b><p style="font-size:13px;color:var(--muted);margin-top:2px;">Connected · syncing every 5 min</p></div>
        <span class="chip" style="background:var(--primary-soft);color:var(--primary-ink);">Apple Health</span>
      </div>

      <button class="btn btn--danger-outline btn--block" type="button" id="btn-profile-logout" data-od-id="profile-logout" style="margin-top:14px;">
        <svg class="ico" aria-hidden="true"><use href="#ic-logout"></use></svg> Log out
      </button>
    </section>
</div><!-- /.stage -->
<nav class="tabbar" aria-label="Main navigation" data-od-id="tabbar">
      <button class="tab" data-tab="scr-today" data-od-id="tab-today">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="rotate(-12 8.2 10.5)"><ellipse cx="8.2" cy="10.9" rx="2.7" ry="3.6"/><circle cx="6.1" cy="5.5" r="1.05"/><circle cx="8.6" cy="4.6" r="1.1"/><circle cx="11.1" cy="5.6" r="0.85"/><ellipse cx="8.4" cy="16.6" rx="1.9" ry="2.1"/></g><g transform="rotate(12 15.8 14.5)"><ellipse cx="15.8" cy="14.9" rx="2.7" ry="3.6"/><circle cx="13.4" cy="9.9" r="0.85"/><circle cx="15.7" cy="8.9" r="1.1"/><circle cx="18.1" cy="9.8" r="1.05"/><ellipse cx="15.9" cy="20.5" rx="1.9" ry="1.9"/></g></svg>Today
      </button>
      <button class="tab" data-tab="scr-groups" data-od-id="tab-groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>Groups
      </button>
      <button class="tab" data-tab="scr-leaderboard" data-od-id="tab-leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17.5V21M7 4h10v4.5a5 5 0 0 1-10 0V4Z"/><path d="M7 5.5H4.2v1.6a3.2 3.2 0 0 0 3 3.2M17 5.5h2.8v1.6a3.2 3.2 0 0 1-3 3.2"/></svg>Board
      </button>
      <button class="tab" data-tab="scr-chat" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>Chat
      </button>
      <button class="tab" data-tab="scr-profile" data-od-id="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Profile
      </button>
    </nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="logout-sheet" role="dialog" aria-modal="true" aria-label="Log out confirmation" data-od-id="logout-sheet">
      <div class="sheet__grab" aria-hidden="true"></div>
      <h3>Log out?</h3>
      <p id="logout-sheet-demo" hidden>Your demo progress will not be saved</p>
      <button class="btn btn--danger btn--block" id="btn-logout-confirm" data-od-id="logout-confirm">Log out</button>
      <button class="btn btn--cancel btn--block" id="btn-logout-cancel" data-od-id="logout-cancel">Cancel</button>
    </div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div><!-- /.phone -->
    </div><!-- /.device-frame -->
  </div><!-- /.fit -->
  <figcaption class="device-caption" data-od-id="device-caption"><b>StrideSquad</b> — tap around, it works</figcaption>
</figure>

<script src="assets/app.js"></script>
</body>
</html>
