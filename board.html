<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StrideSquad — Interactive Prototype v8</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="board" data-screen="scr-leaderboard">

<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">
<div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
<div class="stage">
<section id="scr-leaderboard" class="screen" data-screen data-od-id="leaderboards" aria-label="Leaderboards">


            <header class="appbar" data-od-id="appbar">
        <span class="appbar__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="8.2" rx="3.1" ry="4.4" transform="rotate(-14 9 8.2)"/><ellipse cx="15.6" cy="14" rx="3.1" ry="4.4" transform="rotate(14 15.6 14)"/></svg></span>
        <div class="appbar__text">
          <b class="appbar__title" id="appbar-title">Board</b>
          <span class="appbar__mini" id="lb-sub">Global weekly</span>
        </div>
        <span class="appbar__acts"><button class="icon-btn appbar__act" id="btn-lb-filters" type="button" aria-label="Filter leaderboard" aria-haspopup="dialog" data-od-id="leaderboard-filters-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5h17L14 12.6v5.4l-4 2.4v-7.8L3.5 5.5Z"/></svg>
          </button> <button class="icon-btn appbar__act" id="btn-lb-search" type="button" aria-label="Search walkers" aria-expanded="false" data-od-id="leaderboard-search-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.6"/><path d="m16 16 4.6 4.6"/></svg>
          </button> <button class="icon-btn appbar__act" id="btn-lb-chat" type="button" aria-label="Open Global Chat" data-od-id="leaderboard-chat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>
          </button></span> <button class="icon-btn bell appbar__bell" id="appbar-bell" type="button" data-goto="scr-notif" aria-label="Notifications — 4 unread" data-od-id="appbar-bell"><svg class="ico" aria-hidden="true"><use href="#ic-bell"></use></svg><span class="bell__dot" data-bell-dot aria-hidden="true"></span></button> <button class="sole-pill appbar__coin" id="appbar-coin" type="button" data-goto="scr-wallet" aria-label="Sole wallet — 128 coins, up 12 today" data-od-id="appbar-coin"><svg class="ico" aria-hidden="true"><use href="#ic-coin"></use></svg><b class="num">128</b><i>+12 today</i></button>
      </header>
<div class="seg" role="group" aria-label="Board scope" data-od-id="leaderboard-seg-scope">
        <button class="active" id="seg-group" data-scope="mygroup">My Group</button>
        <button id="seg-global" data-scope="global">Global</button>
      </div>
      <div class="seg" role="group" aria-label="Time range" data-od-id="leaderboard-seg-range">
        <button class="active" id="seg-daily" data-range="daily">Daily</button>
        <button id="seg-weekly" data-range="weekly">Weekly</button>
      </div>

      <div class="gchips" id="lb-gchips" role="group" aria-label="Pick a group" data-od-id="leaderboard-group-chips"></div>

      <div class="lb-you" id="lb-you-card" role="status" aria-label="Your position on this board" data-od-id="leaderboard-you-card">
        <span class="lb-you__rank"><b class="num" id="lby-rank">#—</b><span id="lby-total">of —</span></span>
        <span class="avatar avatar--slate" id="lby-av" aria-hidden="true">YO</span>
        <span class="lb-you__body">
          <span class="lb-you__name">You <span class="chip chip--rec" aria-hidden="true">YOU</span> <span class="chip chip--plus u-hide" id="lby-plus" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="#ic-spark"></use></svg> Plus</span></span>
          <span class="lb-you__steps num" id="lby-steps">7,842 steps today</span>
        </span>
        <span class="lb-delta lb-delta--neg" id="lby-delta"><b>—</b><small>vs avg</small></span>
      </div>

      <div class="lb-search u-hide" id="lb-search-bar" data-od-id="leaderboard-search-bar">
        <svg class="lb-search__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.6"/><path d="m16 16 4.6 4.6"/></svg>
        <input id="lb-search-input" type="search" placeholder="Search walkers by name" aria-label="Search walkers by name" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="lb-search__x" type="button" id="lb-search-close" aria-label="Close search" data-od-id="leaderboard-search-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg></button>
      </div>

      <div class="card" style="margin-top:8px;" data-od-id="leaderboard-list">
        <div id="lb-list"></div>
        <div id="lb-skel" hidden aria-hidden="true"></div>
        <div class="empty u-hide" id="lb-empty" data-od-id="leaderboard-empty"><b>No walkers match</b><p>Names are checked as you type — try fewer letters.</p></div>
        <p class="lb-end u-hide" id="lb-end" data-od-id="leaderboard-end">That is every walker on the planet — for today.</p>
      </div>
    </section>
</div><!-- /.stage -->
<nav class="tabbar" aria-label="Main navigation" data-od-id="tabbar">
      <button class="tab" data-tab="scr-today" data-od-id="tab-today">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="rotate(-12 8.2 10.5)"><ellipse cx="8.2" cy="10.9" rx="2.7" ry="3.6"/><circle cx="6.1" cy="5.5" r="1.05"/><circle cx="8.6" cy="4.6" r="1.1"/><circle cx="11.1" cy="5.6" r="0.85"/><ellipse cx="8.4" cy="16.6" rx="1.9" ry="2.1"/></g><g transform="rotate(12 15.8 14.5)"><ellipse cx="15.8" cy="14.9" rx="2.7" ry="3.6"/><circle cx="13.4" cy="9.9" r="0.85"/><circle cx="15.7" cy="8.9" r="1.1"/><circle cx="18.1" cy="9.8" r="1.05"/><ellipse cx="15.9" cy="20.5" rx="1.9" ry="1.9"/></g></svg>Today
      </button>
      <button class="tab" data-tab="scr-groups" data-od-id="tab-groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>Groups
      </button>
      <button class="tab" data-tab="scr-leaderboard" data-od-id="tab-leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17.5V21M7 4h10v4.5a5 5 0 0 1-10 0V4Z"/><path d="M7 5.5H4.2v1.6a3.2 3.2 0 0 0 3 3.2M17 5.5h2.8v1.6a3.2 3.2 0 0 1-3 3.2"/></svg>Board
      </button>
      <button class="tab" data-tab="scr-chat" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>Chat
      </button>
      <button class="tab" data-tab="scr-profile" data-od-id="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Profile
      </button>
    </nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="lb-filter-sheet" role="dialog" aria-modal="true" aria-label="Leaderboard filters" data-od-id="leaderboard-filter-sheet">
      <div class="sheet__grab" aria-hidden="true"></div>
      <button class="sheet__x" type="button" id="btn-filter-close" aria-label="Close filters" data-od-id="leaderboard-filter-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg></button>
      <h3>Filters</h3>
      <p>Tune the board once — Done applies everything.</p>
      <span class="fs-label" id="fs-period-label">Period</span>
      <div class="fs-radios" role="radiogroup" aria-labelledby="fs-period-label">
        <label class="fs-opt"><input type="radio" name="fs-period" value="daily" data-od-id="filter-period-daily">Daily</label>
        <label class="fs-opt"><input type="radio" name="fs-period" value="weekly" data-od-id="filter-period-weekly">Weekly</label>
      </div>
      <span class="fs-label" id="fs-scope-label">Scope</span>
      <div class="fs-radios" role="radiogroup" aria-labelledby="fs-scope-label">
        <label class="fs-opt"><input type="radio" name="fs-scope" value="mygroup" data-od-id="filter-scope-mygroup">My Group</label>
        <label class="fs-opt"><input type="radio" name="fs-scope" value="global" data-od-id="filter-scope-global">Global</label>
      </div>
      <label class="fs-label" for="fs-region">Region</label>
      <select class="fs-select" id="fs-region" data-od-id="filter-region-select" aria-label="Region">
        <option value="global">Global</option>
        <option value="nairobi">Nairobi</option>
        <option value="kisumu">Kisumu</option>
      </select>
      <p class="fs-note">Region narrows Global · squad boards: all members.</p>
      <button class="btn btn--primary btn--block fs-apply" type="button" id="btn-filter-done" data-od-id="leaderboard-filter-done">Done</button>
    </div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div><!-- /.phone -->
    </div><!-- /.device-frame -->
  </div><!-- /.fit -->
  <figcaption class="device-caption" data-od-id="device-caption"><b>StrideSquad</b> — tap around, it works</figcaption>
</figure>

<script src="assets/app.js"></script>
</body>
</html>
