<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StrideSquad — Interactive Prototype v8</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="settings-account" data-screen="scr-settings-account">

<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">
<div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
<div class="stage">
<section id="scr-settings-account" class="screen" data-screen data-od-id="settings-account" aria-label="Account settings">
<div class="screen-head"><div><h2 class="screen-title" style="font-size:23px;">Account</h2><p class="screen-sub">Your identity, connections and data</p></div><button class="icon-btn" data-goto="scr-settings" aria-label="Back" data-od-id="settings-account-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button></div>
      <div class="card" id="acct-auth-card" data-od-id="acct-auth-card">
        <div class="srow" id="acct-auth-row">
          <span class="srow__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7.5 8.5 6 8.5-6"/></svg></span>
          <span class="srow__t"><b id="acct-auth-title">No account yet</b><span id="acct-auth-sub">Sign up to save your 12-day streak</span></span>
          <button class="la-btn" type="button" id="btn-acct-auth" data-od-id="acct-auth-cta">Sign up</button>
        </div>
      </div>
      <div class="card" data-od-id="account-manage">
<button class="srow" type="button" data-goto="scr-edit-profile" data-od-id="acct-edit"><span class="srow__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 20 1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19Z"/><path d="m14.5 6.5 3 3"/></svg></span><span class="srow__t"><b>Edit profile</b><span>Name and photo</span></span><span class="srow__end" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></button>
<button class="srow" type="button" data-goto="scr-buddies" data-od-id="acct-buddies"><span class="srow__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg></span><span class="srow__t"><b>Buddies &amp; requests</b><span>Who cheers you · pending buddy &amp; DM requests</span></span><span class="srow__end"><span class="badge" id="acct-req-badge">4</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button>
<button class="srow" type="button" id="acct-plus-row" data-od-id="acct-plus"><span class="srow__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9L6.6 19.6l1.1-6L3.2 9.4l6.1-.8Z"/></svg></span><span class="srow__t"><b>StrideSquad+</b><span id="acct-plus-sub">Not subscribed — see Store › Premium</span></span><span class="srow__end"><span class="status-chip" id="acct-plus-state">Off</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button>
<button class="srow" type="button" data-goto="scr-linked-accounts" data-od-id="acct-linked"><span class="srow__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg></span><span class="srow__t"><b>Linked accounts</b><span>Apple, Google, Health Connect</span></span><span class="srow__end" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></button>
<button class="srow" type="button" data-goto="scr-change-password" data-od-id="acct-passwd"><span class="srow__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4.2"/><path d="m11 12 8-8M17 4l3 3M15 6l3 3"/></svg></span><span class="srow__t"><b>Change password</b><span>Last changed 3 months ago</span></span><span class="srow__end" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></button>
        <div class="srow">
          <span class="srow__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/></svg></span>
          <span class="srow__t"><b>Export my data</b><span>Steps, squads, chats — .zip</span></span>
          <span class="srow__end"><span class="status-chip" id="export-chip" data-od-id="export-chip">Ready</span>
          <button class="la-btn" type="button" id="btn-export" data-od-id="acct-export">Request</button></span>
        </div>
        <div class="srow">
          <span class="srow__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9"/></svg></span>
          <span class="srow__t"><b>Sign out</b><span id="signout-sub">You&rsquo;re signed in as you@stridesquad.app</span></span>
          <button class="la-btn" type="button" id="btn-signout" data-od-id="acct-signout">Sign out</button>
        </div>
      </div>
      <div class="card" data-od-id="account-danger">
        <button class="srow danger-row" type="button" id="btn-open-delete" data-od-id="acct-delete">
          <span class="srow__ic srow__ic--danger" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 12.5h9L18 7M10 11v5m4-5v5"/></svg></span>
          <span class="srow__t"><b>Delete account</b><span>Permanent — takes 30 days to fully erase</span></span>
          <span class="srow__end" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </button>
      </div>
    </section>
</div><!-- /.stage -->
<nav class="tabbar" aria-label="Main navigation" data-od-id="tabbar">
      <button class="tab" data-tab="scr-today" data-od-id="tab-today">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="rotate(-12 8.2 10.5)"><ellipse cx="8.2" cy="10.9" rx="2.7" ry="3.6"/><circle cx="6.1" cy="5.5" r="1.05"/><circle cx="8.6" cy="4.6" r="1.1"/><circle cx="11.1" cy="5.6" r="0.85"/><ellipse cx="8.4" cy="16.6" rx="1.9" ry="2.1"/></g><g transform="rotate(12 15.8 14.5)"><ellipse cx="15.8" cy="14.9" rx="2.7" ry="3.6"/><circle cx="13.4" cy="9.9" r="0.85"/><circle cx="15.7" cy="8.9" r="1.1"/><circle cx="18.1" cy="9.8" r="1.05"/><ellipse cx="15.9" cy="20.5" rx="1.9" ry="1.9"/></g></svg>Today
      </button>
      <button class="tab" data-tab="scr-groups" data-od-id="tab-groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>Groups
      </button>
      <button class="tab" data-tab="scr-leaderboard" data-od-id="tab-leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17.5V21M7 4h10v4.5a5 5 0 0 1-10 0V4Z"/><path d="M7 5.5H4.2v1.6a3.2 3.2 0 0 0 3 3.2M17 5.5h2.8v1.6a3.2 3.2 0 0 1-3 3.2"/></svg>Board
      </button>
      <button class="tab" data-tab="scr-chat" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>Chat
      </button>
      <button class="tab" data-tab="scr-profile" data-od-id="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Profile
      </button>
    </nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="delete-sheet" role="dialog" aria-modal="true" aria-label="Delete account confirmation" data-od-id="delete-sheet">
      <div class="sheet__grab" aria-hidden="true"></div>
      <h3 style="color:var(--danger);">Delete your account?</h3>
      <p>Everything below goes with it:</p>
      <div class="del-box" data-od-id="delete-what-you-lose">
        <ul>
          <li>Your <b>12-day streak</b> and goal history</li>
          <li>Membership + rank in <b>3 squads</b> (you&rsquo;ll leave silently)</li>
          <li>All <b>chats and DMs</b> you&rsquo;ve sent</li>
          <li>Achievements and export requests</li>
        </ul>
      </div>
      <div class="field" style="margin-top:14px;">
        <label for="del-input">Type <b style="font-family:var(--mono);">DELETE</b> to confirm</label>
        <input id="del-input" type="text" autocomplete="off" spellcheck="false" placeholder="DELETE">
      </div>
      <p class="fineprint" style="text-align:left;">Erasure isn&rsquo;t instant on purpose: your data is deleted within 30 days. Signing back in inside that window cancels everything.</p>
      <button class="btn btn--danger btn--block" id="btn-delete-acct" disabled data-od-id="delete-confirm">Delete account</button>
      <button class="btn btn--cancel btn--block" id="btn-delete-cancel" data-od-id="delete-cancel">Cancel</button>
    </div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div><!-- /.phone -->
    </div><!-- /.device-frame -->
  </div><!-- /.fit -->
  <figcaption class="device-caption" data-od-id="device-caption"><b>StrideSquad</b> — tap around, it works</figcaption>
</figure>

<script src="assets/app.js"></script>
</body>
</html>
