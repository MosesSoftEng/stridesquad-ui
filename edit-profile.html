<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>StrideSquad — Interactive Prototype v8</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="edit-profile" data-screen="scr-edit-profile">

<figure class="device" data-od-id="device">
  <div class="fit">
    <div class="device-frame" data-od-id="device-frame">
      <span class="dev-btn dev-btn--mute" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--volup" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--voldown" aria-hidden="true"></span>
      <span class="dev-btn dev-btn--power" aria-hidden="true"></span>

      <div class="phone no-tabbar" data-od-id="phone">
<div class="ios-sb" data-od-id="status-bar" aria-hidden="true">
          <span class="ios-sb__time">9:41</span>
          <span class="ios-sb__island"></span>
          <span class="ios-sb__icons">
            <!-- signal -->
            <svg width="18" height="11" viewBox="0 0 20 12" fill="currentColor" stroke="none" aria-hidden="true">
              <rect x="0" y="9" width="3" height="3" rx="1"/><rect x="4.7" y="6" width="3" height="6" rx="1"/>
              <rect x="9.4" y="3" width="3" height="9" rx="1"/><rect x="14.1" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.8 7a6.3 6.3 0 0 1 8.4 0"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
            <!-- battery -->
            <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="0.6" y="0.8" width="21" height="10.4" rx="3" stroke-width="1.2"/>
              <rect x="2.2" y="2.4" width="15" height="7.2" rx="1.8" fill="currentColor" stroke="none"/>
              <path d="M23.2 4.2v3.6" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
<div class="stage">
<section id="scr-edit-profile" class="screen" data-screen data-od-id="edit-profile" aria-label="Edit profile">
<div class="screen-head"><div><h2 class="screen-title" style="font-size:23px;">Edit profile</h2><p class="screen-sub">Name and photo — takes a minute</p></div><button class="icon-btn" data-goto="scr-settings-account" aria-label="Back" data-od-id="edit-profile-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button></div>
      <div class="card" data-od-id="edit-photo-card">
        <p class="card-label">Photo</p>
        <div style="display:flex;align-items:center;gap:16px;">
          <div class="avatar avatar--lg" id="ep-preview" aria-hidden="true">YO</div>
          <div class="field" style="margin:0;flex:1;">
            <label for="ep-initials">Initials</label>
            <input id="ep-initials" type="text" maxlength="2" value="YO" autocomplete="off" spellcheck="false" style="text-transform:uppercase;font-family:var(--mono);letter-spacing:.2em;text-align:center;">
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;" role="group" aria-label="Photo color" data-od-id="edit-swatches">
          <button class="swatch active" type="button" data-av="" aria-label="Green">YO</button>
          <button class="swatch swatch--lime" type="button" data-av="lime" aria-label="Lime">YO</button>
          <button class="swatch swatch--slate" type="button" data-av="slate" aria-label="Slate">YO</button>
          <button class="swatch swatch--amber" type="button" data-av="amber" aria-label="Amber">YO</button>
        </div>
        <button class="btn btn--ghost btn--block" type="button" id="btn-change-avatar" style="margin-top:14px;" data-od-id="edit-change-avatar">Change avatar</button>
      </div>
      <div class="card" style="margin-top:14px;" data-od-id="edit-name-card">
        <div class="field">
          <label for="ep-name">Display name</label>
          <input id="ep-name" type="text" value="You" maxlength="24" autocomplete="name">
        </div>
        <div class="field" style="margin:0;">
          <label for="ep-username">Username</label>
          <input id="ep-username" type="text" value="you.walks" maxlength="20" autocapitalize="off" spellcheck="false" autocomplete="off">
        </div>
      </div>
      <div class="card" style="margin-top:14px;" data-od-id="edit-bio-card">
        <div class="field" style="margin:0;">
          <div class="field__top">
            <label for="ep-bio">Bio</label>
            <span class="field__count" id="ep-bio-count">0 of 80</span>
          </div>
          <textarea id="ep-bio" maxlength="80" placeholder="Say what keeps you walking — one line is plenty."></textarea>
        </div>
      </div>
      <div class="card" style="margin-top:14px;" data-od-id="edit-location-card">
        <p class="card-label">Location</p>
        <p class="vis-note">City level only — never precise GPS.</p>
        <div class="loc-grid">
          <div class="field" style="margin:0;">
            <label for="ep-state">State</label>
            <select id="ep-state"><option>Nairobi</option><option>Kiambu</option><option>Nakuru</option><option>Mombasa</option><option>Kisumu</option></select>
          </div>
          <div class="field" style="margin:0;">
            <label for="ep-city">City</label>
            <select id="ep-city"></select>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:14px;" data-od-id="edit-visibility-card">
        <p class="card-label">Visibility</p>
        <div class="set-row">
          <div class="set-row__t"><b>Show me on Nearby &amp; boards</b><span>Off makes you a "Hidden walker"</span></div>
          <button class="switch" role="switch" aria-checked="true" id="sw-vis-boards" aria-label="Show me on Nearby and boards" data-od-id="settings-toggle-vis-boards"></button>
        </div>
        <div class="set-row">
          <div class="set-row__t"><b>Show achievements on my profile</b><span>Badges row on your walker profile</span></div>
          <button class="switch" role="switch" aria-checked="true" id="sw-vis-ach" aria-label="Show achievements on my profile" data-od-id="settings-toggle-vis-ach"></button>
        </div>
      </div>
      <button class="btn btn--primary btn--block" id="btn-save-profile" style="margin-top:18px;" data-od-id="edit-profile-save">Save profile</button>
    </section>
</div><!-- /.stage -->
<nav class="tabbar" aria-label="Main navigation" data-od-id="tabbar">
      <button class="tab" data-tab="scr-today" data-od-id="tab-today">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="rotate(-12 8.2 10.5)"><ellipse cx="8.2" cy="10.9" rx="2.7" ry="3.6"/><circle cx="6.1" cy="5.5" r="1.05"/><circle cx="8.6" cy="4.6" r="1.1"/><circle cx="11.1" cy="5.6" r="0.85"/><ellipse cx="8.4" cy="16.6" rx="1.9" ry="2.1"/></g><g transform="rotate(12 15.8 14.5)"><ellipse cx="15.8" cy="14.9" rx="2.7" ry="3.6"/><circle cx="13.4" cy="9.9" r="0.85"/><circle cx="15.7" cy="8.9" r="1.1"/><circle cx="18.1" cy="9.8" r="1.05"/><ellipse cx="15.9" cy="20.5" rx="1.9" ry="1.9"/></g></svg>Today
      </button>
      <button class="tab" data-tab="scr-groups" data-od-id="tab-groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.8" cy="9.2" r="2.6"/><path d="M15.5 14.4a5 5 0 0 1 5 4.6"/></svg>Groups
      </button>
      <button class="tab" data-tab="scr-leaderboard" data-od-id="tab-leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17.5V21M7 4h10v4.5a5 5 0 0 1-10 0V4Z"/><path d="M7 5.5H4.2v1.6a3.2 3.2 0 0 0 3 3.2M17 5.5h2.8v1.6a3.2 3.2 0 0 1-3 3.2"/></svg>Board
      </button>
      <button class="tab" data-tab="scr-chat" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-4-.9L3 20.5l1.4-5.5a8.5 8.5 0 1 1 16.6-3.5Z"/></svg>Chat
      </button>
      <button class="tab" data-tab="scr-profile" data-od-id="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Profile
      </button>
    </nav>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div><!-- /.phone -->
    </div><!-- /.device-frame -->
  </div><!-- /.fit -->
  <figcaption class="device-caption" data-od-id="device-caption"><b>StrideSquad</b> — tap around, it works</figcaption>
</figure>

<script src="assets/app.js"></script>
</body>
</html>
